# 홈서버 앞단 프록시(SOMA-700). 배포는 이 컨테이너를 다시 만들지 않고 reload 만 한다 — 그래서 터널(cloudflared)과 web 이
# 붙는 상대가 배포 중에도 그대로다. 넘겨줄 지금 판의 컨테이너는 deploy.sh 가 쓰는 active.conf 가 정한다.
#
# 이름은 compose 의 망 별칭으로 받는다(compose.yml 의 proxy 서비스):
#   edge 망의 web  → :3000 → 지금 판의 web 컨테이너   — Cloudflare 터널의 서비스 주소 http://web:3000
#   front 망의 api → :8080 → 지금 판의 api 컨테이너   — 웹 이미지에 굳은 API_ORIGIN=http://api:8080
#
# 이 파일과 active.conf 는 디렉토리째 마운트된다(/etc/nginx/acttub). 파일 하나만 바인드하면 tar·mv 로 바뀐 파일을
# 컨테이너가 못 본다(바인드가 옛 inode 를 잡는다).

# reload 하면 옛 worker 는 처리 중인 요청을 끝내고 나간다. deploy.sh 는 옛 worker 가 다 나간 뒤에 옛 컨테이너를 멈춘다.
# Cloudflare 가 100초에 응답을 끊으므로 그보다 조금 길게 기다린다(deploy.sh 의 DRAIN_SECONDS 와 짝).
worker_shutdown_timeout 120s;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  log_format proxy '$remote_addr "$request" $status $body_bytes_sent $request_time "$upstream_addr" $upstream_status';
  access_log /dev/stdout proxy;

  # Docker 내장 DNS. 같은 이름의 컨테이너가 다시 만들어져 IP 가 바뀌어도(복원 절차의 맨손 compose up) 몇 초 안에 따라가고,
  # 이름이 아직 없어도 nginx 는 뜬다(그동안 502).
  resolver 127.0.0.11 valid=5s ipv6=off;

  # 손님(cloudflared·web) 쪽 keep-alive 를 끈다. 켜 두면 reload 때 옛 worker 가 닫는 연결과 손님의 다음 요청이 엇갈려
  # ECONNRESET 이 난다(SOMA-700 시험). 손님이 같은 호스트 안이라 연결을 매번 맺는 비용은 무시할 만하다.
  keepalive_timeout 0;

  # 프록시가 없던 길(cloudflared → web → api)이 하던 그대로 넘긴다 — 크기 제한·버퍼링·헤더를 새로 얹지 않는다.
  # 본문 한도는 Spring 이 JSON 오류(413 upload_too_large)로 낸다. nginx 가 먼저 자르면 HTML 413 이 된다.
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  # X-Forwarded-For 는 손대지 않는다 — 방문자 IP(apps/api/CONTRACT.md §6-13)는 Cloudflare 가 붙인 값에서 구한다.
  proxy_connect_timeout 5s;
  # 응답을 끊는 것은 Next rewrites(60초)와 Cloudflare(100초)다. 여기서 먼저 끊지 않는다.
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  include /etc/nginx/acttub/active.conf;

  server {
    listen 3000;
    location / {
      proxy_pass http://web_active;
    }
  }

  server {
    listen 8080;
    location / {
      proxy_pass http://api_active;
    }
  }

  # compose healthcheck 전용 — 지금 판의 컨테이너와 무관하게 nginx 자신이 떠 있는지만 본다.
  server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /ping {
      return 204;
    }
  }
}
