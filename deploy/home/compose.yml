# 홈서버 compose(SOMA-489) — dev·prod 가 같은 파일을 쓰고 차이는 .env 값뿐이다.
#
# 실행 위치: /svc/acttub/<env>/{compose.yml,deploy.sh,.env,release.env}
#   .env         사람이 관리(권한 600). 시크릿·프로젝트명·리소스 상한. 배포는 건드리지 않는다.
#   release.env  배포 스크립트가 매번 새로 쓴다. API_IMAGE·WEB_IMAGE·RENDER_GIT_COMMIT·SENTRY_RELEASE.
#
# ⚠ env 는 두 경로로 들어간다. (1) 이 파일 안의 ${...} 치환은 compose 가 --env-file 로 읽은
# 값만 본다(기본은 프로젝트 디렉토리의 .env 하나). release.env 의 API_IMAGE 가 image: 에
# 들어가려면 둘 다 넘겨야 한다:
#     docker compose --env-file .env --env-file release.env up -d
# (2) 컨테이너 환경은 아래 env_file 이 넣는다. 배포 스크립트·smoke.sh 가 이 규칙을 지킨다.
#
# 호스트 포트를 publish 하지 않는다 — 서버의 8080 은 다른 서비스(acttub-rag)가 쓰고, 노출은
# 같은 네트워크의 cloudflared 가 web:3000 으로 직접 간다. 확인은 컨테이너 안에서 curl(api)·node fetch(web).
#
# 조각 01 이 api·db, 02 가 web, 03 이 cloudflared(edge 프로필)를 붙였다. backup(07)이 아래 자리에 붙는다.

# 프로젝트명은 .env 가 정한다(acttub-dev·acttub-prod). 비우면 compose 가 디렉토리 이름을 쓰고 볼륨이
# dev_pgdata 처럼 조용히 다른 이름이 되므로 여기서 요구한다. -p 플래그는 이 값보다 우선한다.
name: ${COMPOSE_PROJECT_NAME:?.env 의 COMPOSE_PROJECT_NAME 이 없다 (acttub-dev | acttub-prod)}

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  api:
    image: ${API_IMAGE:?release.env 의 API_IMAGE 가 없다 — --env-file release.env 를 넘겼는지 확인}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
      - release.env
    # 필수 값은 여기서 한 번 더 요구한다(${VAR:?}). 빠지면 컨테이너를 만들기 전에 compose 가
    # 이름을 찍고 멈춘다 — 앱은 ADMIN_OPS_TOKEN 이 없으면 admin 기능만 조용히 빼고 뜨고,
    # S3 자격증명이 없어도 뜬 뒤 업로드만 503 이라(DEPLOY-VPC §3-3) 앱의 기동 실패에 기댈 수 없다.
    environment:
      # db 서비스와 같은 비밀번호를 두 번 적지 않도록 여기서 조립한다. 비밀번호는 URL 에
      # 그대로 들어가므로 영숫자만 쓴다(.env.example 참고). 사용자·DB 기본값(acttub)은 아래 db
      # 서비스의 environment 와 같아야 한다 — 한쪽만 고치면 api 가 없는 역할로 접속한다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-acttub}:${POSTGRES_PASSWORD:?.env 의 POSTGRES_PASSWORD 가 없다}@db:5432/${POSTGRES_DB:-acttub}
      JWT_SECRET: ${JWT_SECRET:?.env 의 JWT_SECRET 이 없다}
      ADMIN_OPS_TOKEN: ${ADMIN_OPS_TOKEN:?.env 의 ADMIN_OPS_TOKEN 이 없다}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?.env 의 GEMINI_API_KEY 가 없다}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?.env 의 OPENAI_API_KEY 가 없다}
      S3_BUCKET: ${S3_BUCKET:?.env 의 S3_BUCKET 이 없다}
      AWS_REGION: ${AWS_REGION:?.env 의 AWS_REGION 이 없다}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?.env 의 AWS_ACCESS_KEY_ID 가 없다}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?.env 의 AWS_SECRET_ACCESS_KEY 가 없다}
      # healthcheck·web rewrites 가 이 포트를 전제한다. .env 가 덮지 못하게 고정한다(systemd 와 같다).
      SERVER_PORT: "8080"
    healthcheck:
      # /health 는 DB 를 건드리지 않지만, 리슨 자체가 Flyway·스키마 검증 뒤에 시작한다.
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: ${API_CPU_LIMIT:-1.5}
          memory: ${API_MEM_LIMIT:-1536m}
    logging: *logging

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # 기본값은 위 api 의 DATABASE_URL 과 짝이다.
      POSTGRES_USER: ${POSTGRES_USER:-acttub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 의 POSTGRES_PASSWORD 가 없다}
      POSTGRES_DB: ${POSTGRES_DB:-acttub}
    volumes:
      # postgres:18 이미지는 PGDATA 가 /var/lib/postgresql/18/docker 이고 볼륨 마운트 지점이
      # /var/lib/postgresql 이다(17 까지의 /var/lib/postgresql/data 가 아니다). 옛 경로에 붙이면
      # 데이터가 볼륨 밖에 남아 컨테이너를 지우는 순간 사라진다.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 로 TCP 를 본다. 초기화 중 임시 서버는 유닉스 소켓만 열어 그 단계를 healthy 로 읽지 않는다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-512m}
    logging: *logging

  web:
    image: ${WEB_IMAGE:?release.env 의 WEB_IMAGE 가 없다 — --env-file release.env 를 넘겼는지 확인}
    restart: unless-stopped
    # 웹의 /v2/*·/health 는 rewrites 가 http://api:8080 으로 넘긴다(이미지에 굳은 API_ORIGIN).
    # api 가 healthy 가 된 뒤에 뜨게 해 첫 요청부터 502 가 아니게 한다.
    depends_on:
      api:
        condition: service_healthy
    # env_file 을 일부러 두지 않는다. 웹 설정은 전부 이미지에 굳어 있어(API_ORIGIN·NEXT_PUBLIC_*,
    # apps/web/Dockerfile) 런타임 env 가 필요 없고, .env 의 시크릿이 웹 컨테이너로 흘러갈 이유도 없다.
    # PORT=3000·HOSTNAME=0.0.0.0 은 이미지가 정한다.
    healthcheck:
      # 런타임 이미지에 curl 이 없어 node 의 fetch 로 본다. / 는 프리렌더된 정적 HTML 이라 싸다.
      # 서버가 IPv4(0.0.0.0)에 묶여 있어 localhost(::1 로 풀릴 수 있음) 대신 127.0.0.1.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # CPU 상한은 두지 않는다 — 계획 §8 이 web 에는 메모리만 정했다(api 는 1.5cpu).
          memory: ${WEB_MEM_LIMIT:-512m}
    logging: *logging

  # ── 프로필 서비스 — .env 의 COMPOSE_PROFILES(edge,backup)가 켠다. CI 스모크의 테스트용 .env 에는 그 줄이
  # 없어 아래는 뜨지 않고 web·api·db 만 돈다(deploy/home/smoke.sh).
  cloudflared:
    # 노출은 이것뿐이다 — Cloudflare Tunnel 이 밖에서 들어와 같은 네트워크의 web:3000 으로 간다(호스트 포트
    # 없음). 호스트명 → http://web:3000 연결은 Cloudflare 대시보드(터널 설정)에 있어 compose 에는 없다.
    # 버전을 고정한다 — latest 는 재생성 때 조용히 바뀐다. 올릴 때는 여기와 서버의 pull 이 같이 간다.
    image: cloudflare/cloudflared:2026.8.3
    profiles: [edge]
    restart: unless-stopped
    # 이미지 ENTRYPOINT 가 `cloudflared --no-autoupdate` 라 서브커맨드만 적는다. 토큰은 TUNNEL_TOKEN 환경변수로
    # 읽는다. --metrics 는 아래 healthcheck 가 /ready 를 물을 주소(컨테이너 안에서만 열린다).
    command: ["tunnel", "--metrics", "127.0.0.1:2000", "run"]
    environment:
      # ${VAR:?} 는 프로필과 무관하게 파일 전체를 치환할 때 걸린다 — 그래서 스모크의 테스트용 .env 도 쓰지 않는
      # 값을 하나 넣는다. 토큰이 틀리면 여기가 아니라 기동이 잡는다: 형식이 틀리면 프로세스가 "token is not
      # valid" 로 죽어 재시작을 반복하고(실측, 2026-09-03), 형식은 맞는데 연결이 안 되면 아래 healthcheck 가
      # unhealthy 로 둔다. 어느 쪽이든 deploy.sh 의 --wait 가 빨강이다.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?.env 의 TUNNEL_TOKEN 이 없다 (Cloudflare Zero Trust 터널 토큰)}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # 이미지에 curl 이 없다. `cloudflared tunnel ready` 가 /ready 를 부르고 엣지에 연결된 뒤에야 0 을 준다 —
      # 밖으로 못 나가면 unhealthy 라 deploy.sh 의 --wait 가 빨강이 된다. 그래서 Cloudflare 쪽 장애 중에도 배포가
      # 빨강이다 — 터널이 안 붙은 채 초록으로 끝나는 것보다 낫다고 보고 그렇게 둔다.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # backup       profiles [backup], 매일 04:00 KST pg_dump → S3 — SOMA-489 조각 07 이 여기에 붙인다.
  #              deploy.sh 의 --wait 가 기다리므로 healthcheck 가 없으면 running 이면 되고, 있으면 healthy 여야 한다.

volumes:
  # 프로젝트명이 앞에 붙어 acttub-<env>_pgdata 가 된다.
  pgdata:
