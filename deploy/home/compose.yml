# 홈서버 compose(SOMA-489) — dev·prod 가 같은 파일을 쓰고 차이는 .env 값뿐이다.
#
# 실행 위치: /svc/acttub/<env>/{compose.yml,deploy.sh,.env,release.env}
#   .env         사람이 관리(권한 600). 시크릿·프로젝트명·리소스 상한. 배포는 건드리지 않는다.
#   release.env  배포 스크립트가 매번 새로 쓴다. API_IMAGE·WEB_IMAGE·RENDER_GIT_COMMIT·SENTRY_RELEASE.
#
# ⚠ env 는 두 경로로 들어간다. (1) 이 파일 안의 ${...} 치환은 compose 가 --env-file 로 읽은
# 값만 본다(기본은 프로젝트 디렉토리의 .env 하나). release.env 의 API_IMAGE 가 image: 에
# 들어가려면 둘 다 넘겨야 한다:
#     docker compose --env-file .env --env-file release.env up -d
# (2) 컨테이너 환경은 아래 env_file 이 넣는다. 배포 스크립트·smoke.sh 가 이 규칙을 지킨다.
#
# 호스트 포트를 publish 하지 않는다 — 서버의 8080 은 다른 서비스(acttub-rag)가 쓰고, 노출은
# cloudflared → proxy → web 길뿐이다. 확인은 컨테이너 안에서 curl(api)·node fetch(web)·wget(proxy).
#
# 요청 길: cloudflared →(이름 web) proxy:3000 → web →(이름 api) proxy:8080 → api → db. proxy(nginx)는 배포 때
# 다시 만들지 않고, deploy.sh 가 새 web·api 를 옛 것 옆에 띄운 뒤 proxy 를 reload 해 넘긴다(SOMA-700, 무중단).
#
# 조각 01 이 api·db, 02 가 web, 03 이 cloudflared(edge 프로필), 07 이 backup 프로필을 붙였다.

# 프로젝트명은 .env 가 정한다(acttub-dev·acttub-prod). 비우면 compose 가 디렉토리 이름을 쓰고 볼륨이
# dev_pgdata 처럼 조용히 다른 이름이 되므로 여기서 요구한다. -p 플래그는 이 값보다 우선한다.
name: ${COMPOSE_PROJECT_NAME:?.env 의 COMPOSE_PROJECT_NAME 이 없다 (acttub-dev | acttub-prod)}

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  api:
    image: ${API_IMAGE:?release.env 의 API_IMAGE 가 없다 — --env-file release.env 를 넘겼는지 확인}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
      - release.env
    # 필수 값은 여기서 한 번 더 요구한다(${VAR:?}). 빠지면 컨테이너를 만들기 전에 compose 가
    # 이름을 찍고 멈춘다 — 앱은 ADMIN_OPS_TOKEN 이 없으면 admin 기능만 조용히 빼고 뜨고,
    # S3 자격증명이 없어도 뜬 뒤 업로드만 503 이라 앱의 기동 실패에 기댈 수 없다.
    environment:
      # db 서비스와 같은 비밀번호를 두 번 적지 않도록 여기서 조립한다. 비밀번호는 URL 에
      # 그대로 들어가므로 영숫자만 쓴다(.env.example 참고). 사용자·DB 기본값(acttub)은 아래 db
      # 서비스의 environment 와 같아야 한다 — 한쪽만 고치면 api 가 없는 역할로 접속한다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-acttub}:${POSTGRES_PASSWORD:?.env 의 POSTGRES_PASSWORD 가 없다}@db:5432/${POSTGRES_DB:-acttub}
      JWT_SECRET: ${JWT_SECRET:?.env 의 JWT_SECRET 이 없다}
      # 탈퇴한 신원의 해시(3년 보관)와 제공자 토큰 암호문의 키(SOMA-528). 앱은 비어 있으면
      # JWT_SECRET 에서 파생해 뜨지만, 그렇게 쓴 값은 파생 키 표식(d1:)으로 남는다. 배포에서는
      # 처음부터 전용 키로 쓰게 여기서 요구한다 — 빠지면 배포가 멈추고 직전 판이 계속 돈다.
      ACCOUNT_IDENTITY_HASH_KEY: ${ACCOUNT_IDENTITY_HASH_KEY:?.env 의 ACCOUNT_IDENTITY_HASH_KEY 가 없다}
      ACCOUNT_TOKEN_ENCRYPTION_KEY: ${ACCOUNT_TOKEN_ENCRYPTION_KEY:?.env 의 ACCOUNT_TOKEN_ENCRYPTION_KEY 가 없다}
      # 포트폴리오 공유 링크의 주소(<SITE_URL>/p/<slug>)를 만든다. 웹 이미지에 굳는 NEXT_PUBLIC_SITE_URL 과
      # 같은 값이다. 앱은 비어 있어도 뜨지만 공유 주소가 null 로 나가 기능이 조용히 죽으므로 여기서 요구한다.
      SITE_URL: ${SITE_URL:?.env 의 SITE_URL 이 없다}
      ADMIN_OPS_TOKEN: ${ADMIN_OPS_TOKEN:?.env 의 ADMIN_OPS_TOKEN 이 없다}
      # 앱이 SDK 콜백으로 못 보낸 가입 유입 광고를 서버가 Airbridge 에서 가져온다(SOMA-643). 토큰이 비면 기능이 꺼진다.
      AIRBRIDGE_API_TOKEN: ${AIRBRIDGE_API_TOKEN:-}
      AIRBRIDGE_APP_NAME: ${AIRBRIDGE_APP_NAME:-acttub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 공용 키(GEMINI_API_KEY·OPENAI_API_KEY)와 기능별 키는 모두 선택이다. 기능마다 전용 키나 공용 키 중 하나는 있어야 앱이 뜨고
      # (Gemini 코칭·TTS·챌린지, OpenAI 코칭·대본분리·리포트·기억), 전용 키가 있으면 공용 키보다 먼저 쓴다. prepare-server.sh 가 서버 .env 를 이 조건으로 검사한다.
      # dev·prod 는 같은 변수에 각 서버 .env 가 다른 값을 넣어 가른다(URL 로 가르지 않는다).
      GEMINI_COACH_API_KEY: ${GEMINI_COACH_API_KEY:-}
      GEMINI_TTS_API_KEY: ${GEMINI_TTS_API_KEY:-}
      GEMINI_CHALLENGE_API_KEY: ${GEMINI_CHALLENGE_API_KEY:-}
      OPENAI_COACH_API_KEY: ${OPENAI_COACH_API_KEY:-}
      OPENAI_SCRIPT_SPLIT_API_KEY: ${OPENAI_SCRIPT_SPLIT_API_KEY:-}
      OPENAI_REPORT_API_KEY: ${OPENAI_REPORT_API_KEY:-}
      OPENAI_MEMORY_API_KEY: ${OPENAI_MEMORY_API_KEY:-}
      # 대본 나누기 줄 두 번째 의견(OpenRouter Jev). 없으면 그 단계를 건너뛴다.
      OPENROUTER_SCRIPT_REVIEW_API_KEY: ${OPENROUTER_SCRIPT_REVIEW_API_KEY:-}
      SCRIPT_REVIEW_MODEL: ${SCRIPT_REVIEW_MODEL:-}
      S3_BUCKET: ${S3_BUCKET:?.env 의 S3_BUCKET 이 없다}
      AWS_REGION: ${AWS_REGION:?.env 의 AWS_REGION 이 없다}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?.env 의 AWS_ACCESS_KEY_ID 가 없다}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?.env 의 AWS_SECRET_ACCESS_KEY 가 없다}
      # healthcheck·web rewrites 가 이 포트를 전제한다. .env 가 덮지 못하게 고정한다(systemd 와 같다).
      SERVER_PORT: "8080"
      # 관리 포트는 호스트에 공개하지 않는다. 토큰이 없어도 일반 앱은 기동하며 관리 접근만 거부한다.
      MANAGEMENT_SERVER_PORT: "9091"
      MONITORING_TOKEN: ${MONITORING_TOKEN:-}
      MONITORING_ENVIRONMENT: ${MONITORING_ENVIRONMENT:-local}
      ACTTUB_THREE_LAYERS_ENABLED: ${ACTTUB_THREE_LAYERS_ENABLED:-false}
      ACTTUB_GUEST_DAILY_ANALYSIS_LIMIT_ENABLED: ${ACTTUB_GUEST_DAILY_ANALYSIS_LIMIT_ENABLED:-true}
      # 개인화 연습 알림(SOMA-720). 값은 배포 워크플로가 release.env 로 준다. 꺼져 있으면 옛 저녁 8시 고정 알림이 돈다.
      PRACTICE_REMINDER_ENABLED: ${ACTTUB_PRACTICE_REMINDER_ENABLED:-false}
      # 첫 질문 미리 쓰기(SOMA-780). 첫 질문이 저장되기 전에는 연습 상세·목록이 대화를 내주지 않아 스토어 앱 0.1.5도
      # 시작 요청을 보내고, 시작 요청이 쓰는 중인 첫 질문을 기다려 받는다. 문제가 생기면 false 로 끈다(끄면 앱의 시작 요청 때 쓴다).
      ACTTUB_COACH_FIRST_QUESTION_PREWRITE: ${ACTTUB_COACH_FIRST_QUESTION_PREWRITE:-true}
      # PG 심사 전용 테스트 빌링(SOMA-620). dev에서만 명시적으로 켜며 기본은 꺼짐이다.
      # 실제 결제 키는 API가 거부한다. 웹 컨테이너에는 이 값을 전달하지 않는다.
      # 리딩 발음 보고서(SOMA-606, 실험). dev .env 에서만 켠다 — 기본은 꺼짐이고 허용 사용자 목록이 비면 아무도 받지 않는다.
      # 채점 서비스는 아래 pron(프로필 pron)이다. 운영 .env 에는 이 값들과 프로필을 넣지 않는다.
      PRON_REPORT_ENABLED: ${PRON_REPORT_ENABLED:-false}
      PRON_REPORT_ALLOWED_USERS: ${PRON_REPORT_ALLOWED_USERS:-}
      PRON_SCORER_URL: ${PRON_SCORER_URL:-}
      ACTTUB_PG_REVIEW_ENABLED: ${ACTTUB_PG_REVIEW_ENABLED:-false}
      ACTTUB_PG_REVIEW_ORIGIN: ${ACTTUB_PG_REVIEW_ORIGIN:-}
      ACTTUB_PG_REVIEW_USERNAME: ${ACTTUB_PG_REVIEW_USERNAME:-}
      ACTTUB_PG_REVIEW_PASSWORD_SHA256: ${ACTTUB_PG_REVIEW_PASSWORD_SHA256:-}
      ACTTUB_PG_REVIEW_TOSS_CLIENT_KEY: ${ACTTUB_PG_REVIEW_TOSS_CLIENT_KEY:-}
      ACTTUB_PG_REVIEW_TOSS_SECRET_KEY: ${ACTTUB_PG_REVIEW_TOSS_SECRET_KEY:-}
      # ACTTUB Pro 결제(SOMA-818). 기본은 둘 다 꺼짐 — WEB 이 꺼져 있으면 토스 실결제가 나가지 않는다. 키·시크릿은 .env 에만 둔다.
      BILLING_WEB_ENABLED: ${BILLING_WEB_ENABLED:-false}
      BILLING_APP_ENABLED: ${BILLING_APP_ENABLED:-false}
      BILLING_FREE_LIMITS_ENABLED: ${BILLING_FREE_LIMITS_ENABLED:-false}
      BILLING_PUBLIC_ORIGIN: ${BILLING_PUBLIC_ORIGIN:-}
      BILLING_WEB_RETURN_URL: ${BILLING_WEB_RETURN_URL:-}
      BILLING_TOSS_CLIENT_KEY: ${BILLING_TOSS_CLIENT_KEY:-}
      BILLING_TOSS_SECRET_KEY: ${BILLING_TOSS_SECRET_KEY:-}
      BILLING_APPLE_ENABLED: ${BILLING_APPLE_ENABLED:-false}
      BILLING_APPLE_BUNDLE_ID: ${BILLING_APPLE_BUNDLE_ID:-com.acttub.app}
      BILLING_APPLE_APP_ID: ${BILLING_APPLE_APP_ID:-}
      BILLING_APPLE_ONLINE_CHECKS: ${BILLING_APPLE_ONLINE_CHECKS:-false}
      BILLING_APPLE_API_PRIVATE_KEY: ${BILLING_APPLE_API_PRIVATE_KEY:-}
      BILLING_APPLE_API_KEY_ID: ${BILLING_APPLE_API_KEY_ID:-}
      BILLING_APPLE_API_ISSUER_ID: ${BILLING_APPLE_API_ISSUER_ID:-}
      BILLING_GOOGLE_ENABLED: ${BILLING_GOOGLE_ENABLED:-false}
      BILLING_GOOGLE_PACKAGE_NAME: ${BILLING_GOOGLE_PACKAGE_NAME:-com.acttub.app}
      BILLING_GOOGLE_SERVICE_ACCOUNT_JSON: ${BILLING_GOOGLE_SERVICE_ACCOUNT_JSON:-}
      BILLING_GOOGLE_PUSH_AUTH: ${BILLING_GOOGLE_PUSH_AUTH:-}
      BILLING_GOOGLE_PUSH_TOKEN: ${BILLING_GOOGLE_PUSH_TOKEN:-}
      BILLING_GOOGLE_PUSH_AUDIENCE: ${BILLING_GOOGLE_PUSH_AUDIENCE:-}
      BILLING_GOOGLE_PUSH_SERVICE_ACCOUNT: ${BILLING_GOOGLE_PUSH_SERVICE_ACCOUNT:-}
      # 관측(SOMA-517). 비면 기록이 통째로 꺼지므로 :? 를 붙이지 않는다 — 관측이 없다고
      # 연습이 멈추면 앞뒤가 바뀐다. 값은 .env 가 준다.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # 기록을 환경별로 가른다(SOMA-555). 비면 Langfuse 가 default 로 묶으므로 기본값을 두지
      # 않는다 — 여기서 dev·운영을 헷갈리게 박느니 구분 없이 들어가는 편이 낫다.
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-}
    networks:
      default: {}
      scrape:
        aliases: ["${COMPOSE_PROJECT_NAME}-api"]
    # 관측 서버는 같은 호스트의 다른 Compose 프로젝트다. 공용 네트워크로 묶지 않는 이유는
    # 기동 순서다 — external 네트워크로 엮으면 관측 스택이 없을 때 api 가 아예 뜨지 않는다.
    # 호스트 게이트웨이로 가면 두 스택이 서로를 모른 채 각자 뜬다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /health 는 DB 를 건드리지 않지만, 리슨 자체가 Flyway·스키마 검증 뒤에 시작한다.
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    # Spring Boot 의 graceful shutdown 은 단계마다 30초까지 기다린다. Docker 기본(10초)이면 그 전에 SIGKILL 이다.
    stop_grace_period: 40s
    # 호스트 메모리가 바닥나면 커널이 점수 높은 프로세스부터 죽인다. 같은 박스의 다른 스택보다
    # 늦게 죽도록 낮추되, 데이터를 쥔 db 보다는 먼저다.
    oom_score_adj: -500
    deploy:
      resources:
        limits:
          cpus: ${API_CPU_LIMIT:-1.5}
          memory: ${API_MEM_LIMIT:-1536m}
    logging: *logging

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # 기본값은 위 api 의 DATABASE_URL 과 짝이다.
      POSTGRES_USER: ${POSTGRES_USER:-acttub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 의 POSTGRES_PASSWORD 가 없다}
      POSTGRES_DB: ${POSTGRES_DB:-acttub}
    volumes:
      # postgres:18 이미지는 PGDATA 가 /var/lib/postgresql/18/docker 이고 볼륨 마운트 지점이
      # /var/lib/postgresql 이다(17 까지의 /var/lib/postgresql/data 가 아니다). 옛 경로에 붙이면
      # 데이터가 볼륨 밖에 남아 컨테이너를 지우는 순간 사라진다.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 로 TCP 를 본다. 초기화 중 임시 서버는 유닉스 소켓만 열어 그 단계를 healthy 로 읽지 않는다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # 박스에서 가장 마지막에 죽어야 한다(위 api 의 oom_score_adj 참고).
    oom_score_adj: -800
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-512m}
    logging: *logging

  web:
    image: ${WEB_IMAGE:?release.env 의 WEB_IMAGE 가 없다 — --env-file release.env 를 넘겼는지 확인}
    restart: unless-stopped
    # 웹의 /v2/*·/health 는 rewrites 가 http://api:8080 으로 넘긴다(이미지에 굳은 API_ORIGIN). front 망에서 그 이름은
    # proxy 가 받아 지금 판의 api 로 넘긴다. api·proxy 가 healthy 가 된 뒤에 뜨게 해 첫 요청부터 502 가 아니게 한다.
    depends_on:
      api:
        condition: service_healthy
      proxy:
        condition: service_healthy
    # front 망에만 둔다 — 진짜 api 컨테이너와 같은 망에 있으면 api 가 둘로 풀려 proxy 를 건너뛴다(proxy 주석).
    networks: [front]
    # env_file 을 일부러 두지 않는다. 웹 설정은 전부 이미지에 굳어 있어(API_ORIGIN·NEXT_PUBLIC_*,
    # apps/web/Dockerfile) 런타임 env 가 필요 없고, .env 의 시크릿이 웹 컨테이너로 흘러갈 이유도 없다.
    # PORT=3000·HOSTNAME=0.0.0.0 은 이미지가 정한다.
    healthcheck:
      # 런타임 이미지에 curl 이 없어 node 의 fetch 로 본다. / 는 프리렌더된 정적 HTML 이라 싸다.
      # 서버가 IPv4(0.0.0.0)에 묶여 있어 localhost(::1 로 풀릴 수 있음) 대신 127.0.0.1.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # CPU 상한은 두지 않는다 — 계획 §8 이 web 에는 메모리만 정했다(api 는 1.5cpu).
          memory: ${WEB_MEM_LIMIT:-512m}
    logging: *logging

  # 앞단 프록시(SOMA-700, proxy/nginx.conf). 배포는 이것을 다시 만들지 않고 reload 만 한다 — 터널과 web 이 붙는 상대가
  # 배포 중에도 그대로라 끊기지 않는다. 넘겨줄 지금 판의 컨테이너는 deploy.sh 가 proxy/active.conf 에 쓴다.
  # 이미지·망 설정을 바꾸면 이 컨테이너가 다시 만들어지며 그동안은 끊긴다.
  proxy:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    command: ["nginx", "-c", "/etc/nginx/acttub/nginx.conf", "-g", "daemon off;"]
    volumes:
      # 디렉토리째 붙인다. 파일 하나만 바인드하면 tar·mv 로 바뀐 파일을 컨테이너가 못 본다(바인드가 옛 inode 를 잡는다).
      - ./proxy:/etc/nginx/acttub:ro
    # 망 별칭으로 이름을 받는다: 터널이 부르는 web(edge 망)과 웹이 부르는 api(front 망)가 이 프록시다. 그래서
    # Cloudflare 대시보드의 http://web:3000 과 웹 이미지에 굳은 http://api:8080 을 바꾸지 않는다. 진짜 web 은 front 에만,
    # cloudflared 는 edge 에만 둔다 — 한 망에 진짜 컨테이너와 별칭이 같이 있으면 이름이 둘로 풀려 proxy 를 건너뛴다
    # (smoke.sh 가 망마다 하나로만 풀리는지 본다). proxy 는 지금 판을 컨테이너 이름으로 부르므로 별칭과 섞이지 않는다.
    networks:
      default: {}
      front:
        aliases: [api]
      edge:
        aliases: [web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logging

  # ── 프로필 서비스 — .env 의 COMPOSE_PROFILES(edge,backup)가 켠다. CI 스모크의 테스트용 .env 에는 그 줄이
  # 없어 아래는 뜨지 않고 web·api·db·proxy 만 돈다(deploy/home/smoke.sh).
  cloudflared:
    # 노출은 이것뿐이다 — Cloudflare Tunnel 이 밖에서 들어와 web:3000 으로 간다(호스트 포트 없음). edge 망에서 그 이름은
    # proxy 다(proxy 주석). 호스트명 → http://web:3000 연결은 Cloudflare 대시보드(터널 설정)에 있어 compose 에는 없다.
    # 버전을 고정한다 — latest 는 재생성 때 조용히 바뀐다. 올릴 때는 여기와 서버의 pull 이 같이 간다.
    image: cloudflare/cloudflared:2026.8.3
    profiles: [edge]
    restart: unless-stopped
    # 이미지 ENTRYPOINT 가 `cloudflared --no-autoupdate` 라 서브커맨드만 적는다. 토큰은 TUNNEL_TOKEN 환경변수로
    # 읽는다. --metrics 는 아래 healthcheck 가 /ready 를 물을 주소(컨테이너 안에서만 열린다).
    command: ["tunnel", "--metrics", "127.0.0.1:2000", "run"]
    environment:
      # ${VAR:?} 는 프로필과 무관하게 파일 전체를 치환할 때 걸린다 — 그래서 스모크의 테스트용 .env 도 쓰지 않는
      # 값을 하나 넣는다. 토큰이 틀리면 여기가 아니라 기동이 잡는다: 형식이 틀리면 프로세스가 "token is not
      # valid" 로 죽어 재시작을 반복하고(실측, 2026-09-03), 형식은 맞는데 연결이 안 되면 아래 healthcheck 가
      # unhealthy 로 둔다. 어느 쪽이든 deploy.sh 의 --wait 가 빨강이다.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?.env 의 TUNNEL_TOKEN 이 없다 (Cloudflare Zero Trust 터널 토큰)}
    depends_on:
      proxy:
        condition: service_healthy
      web:
        condition: service_healthy
    # edge 망에만 둔다 — 그 망의 web 은 proxy 하나뿐이다(proxy 주석).
    networks: [edge]
    healthcheck:
      # 이미지에 curl 이 없다. `cloudflared tunnel ready` 가 /ready 를 부르고 엣지에 연결된 뒤에야 0 을 준다 —
      # 밖으로 못 나가면 unhealthy 라 deploy.sh 의 --wait 가 빨강이 된다. 그래서 Cloudflare 쪽 장애 중에도 배포가
      # 빨강이다 — 터널이 안 붙은 채 초록으로 끝나는 것보다 낫다고 보고 그렇게 둔다.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          # 실측 20MB 안팎. 상한 없는 컨테이너가 호스트 메모리를 다 먹는 일을 막는다.
          memory: 128m
    logging: *logging

  # 리딩 발음 채점 서비스(SOMA-606, apps/pron). 프로필 pron 이라 COMPOSE_PROFILES 에 pron 을 넣은 환경(dev)에서만 뜬다.
  # 호스트 포트도 터널도 없다 — api 만 default 네트워크에서 http://pron:8000 으로 부른다. 이미지는 아직 배포 워크플로가
  # 굽지 않는다: apps/pron 을 서버에서 직접 빌드해 PRON_IMAGE 로 태그하고 `compose --profile pron up -d pron` 으로 띄운다.
  # deploy.sh 는 이 서비스를 만들거나 다시 만들지 않는다(api·web·db·proxy·cloudflared·backup 만 이름으로 올린다).
  pron:
    image: ${PRON_IMAGE:-acttub-pron:local}
    profiles: [pron]
    restart: unless-stopped
    environment:
      PRON_THREADS: ${PRON_THREADS:-2}
      OMP_NUM_THREADS: ${PRON_THREADS:-2}
    networks:
      default: {}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: ${PRON_CPU_LIMIT:-1.5}
          memory: ${PRON_MEM_LIMIT:-2g}
    logging: *logging

  backup:
    # 비활성 프로필도 compose 치환은 거친다. 실제 backup 프로필 배포는 deploy.sh가 이미지 값을 요구한다.
    image: ${BACKUP_IMAGE:-ghcr.io/acttub/acttub-platform/backup:unconfigured}
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 백업에 필요한 값만 넣는다. API 토큰·LLM 키가 이 컨테이너에 들어가지 않는다.
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-acttub}
      PGDATABASE: ${POSTGRES_DB:-acttub}
      PGPASSWORD: ${POSTGRES_PASSWORD:?.env 의 POSTGRES_PASSWORD 가 없다}
      AWS_REGION: ${AWS_REGION:?.env 의 AWS_REGION 이 없다}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?.env 의 AWS_ACCESS_KEY_ID 가 없다}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?.env 의 AWS_SECRET_ACCESS_KEY 가 없다}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-acttub-db-backups}
      # 프로필이 꺼졌을 때 빈 값을 허용한다. 켜진 서비스는 prefix를 dev/ 또는 prod/로 요구하며 실패한다.
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-04:00}
      TZ: Asia/Seoul
    volumes:
      - backup_state:/var/lib/acttub-backup
    healthcheck:
      # 최초 백업·S3 확인이 끝나야 healthy. 성공 기록은 재생성해도 남으며 26시간이 지나거나 실패하면 빨강이다.
      test: ["CMD", "python3", "/opt/backup/backup.py", "health"]
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEM_LIMIT:-256m}
    logging: *logging

volumes:
  # 프로젝트명이 앞에 붙어 acttub-<env>_pgdata 가 된다.
  pgdata:
  backup_state:

networks:
  default: {}
  # 망 별칭(proxy 주석)을 위해 나눈 망. web 은 front 에만, cloudflared 는 edge 에만 참가한다. 둘 다 밖으로 나가는
  # 연결(Sentry·Cloudflare)이 필요해 internal 이 아니다.
  front: {}
  edge: {}
  # 앱이 소유한다. 별도 모니터링 프로젝트가 없어도 앱 배포는 이 망을 직접 만든다.
  # API만 참가하며 외부 호출은 기존 default 망을 쓴다.
  scrape:
    internal: true
