[project]
name = "acting-api-deploy"
version = "0.1.0"
description = "acting-api monorepo workspace"
requires-python = ">=3.11"
dependencies = [
    "acting-api",
]

[tool.uv]
package = false

[tool.uv.sources]
acting-api = { workspace = true }
acting-llm = { workspace = true }

[tool.uv.workspace]
members = [
    "acting-api",
    "acting-llm",
    "acting-summary",
    "acting-agent",
    "acting-report",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = [
    "acting-api/tests",
    "acting-agent/tests",
    "acting-report/tests",
]
testpaths = [
    "acting-api/tests",
    "acting-llm/tests",
    "acting-summary/tests",
    "acting-agent/tests",
    "acting-report/tests",
]
markers = [
    "gemini: 실제 Gemini API 호출 (opt-in)",
    "db: 실제 PostgreSQL 통합 테스트 (opt-in)",
]
