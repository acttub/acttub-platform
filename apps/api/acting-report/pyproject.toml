[project]
name = "acting-report"
version = "0.1.0"
description = "코치 대화(CoachSession) + 요약(SceneSummary) 기반 종합 진단 리포트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "google-genai>=2.9.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "gradio>=6.19.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
]
