[project]
name = "acting-api"
version = "0.1.0"
description = "연기 분석 플랫폼 v2 API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "google-auth[requests]>=2.38,<3",
    "pyjwt[crypto]>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "boto3>=1.43.50,<2",
    "acting-llm",
    "acting-summary",
    "acting-agent",
    "acting-report",
]

[tool.uv.sources]
acting-llm = { workspace = true }
acting-summary = { workspace = true }
acting-agent = { workspace = true }
acting-report = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
]
