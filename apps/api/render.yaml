services:
  - type: web
    name: acting-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev --package acting-api
    startCommand: uv run --frozen --no-sync --package acting-api alembic -c acting-api/alembic.ini upgrade head && uv run --frozen --no-sync --package acting-api uvicorn acting_api.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: KEEP_ALIVE_URL
        value: "https://acting-api.onrender.com"
