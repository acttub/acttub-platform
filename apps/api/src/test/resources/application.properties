# 테스트 전용 설정. 운영 동작을 바꾸지 않는다.
#
# 설정이 다른 Spring 컨텍스트마다 DB 가 따로 뜨고(FreshDatabasePerContext), 캐시된
# 컨텍스트들이 각자 Hikari 풀을 계속 들고 있다. 기본 풀 크기(10)를 그대로 두면 컨텍스트가
# 늘어날수록 커넥션이 선형으로 쌓여 Postgres 가 "too many clients already" 로 거절하고,
# 구현과 무관한 실패가 무더기로 난다. 테스트는 동시성 케이스에서도 커넥션을 몇 개만 쓰므로
# 상한을 좁혀 둔다. 컨테이너 쪽 max_connections 는 PostgresContainerSupport 가 올린다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
GEMINI_API_KEY=test-not-a-real-key
# 배경 작업(스케줄러)은 테스트에서 끈다. 테스트는 워커를 직접 부르고(runOnce·sweep·runDaily), 켜 두면 세 가지가 흔들린다.
# - 실제 시각으로 도는 워커가 테스트가 넣은 작업을 먼저 집는다(PracticeLifecycleIT 의 pending→running, ExternalOperationIT 의 lease).
# - 기억 워커의 첫 폴(coach_conversations→practices→users 순 잠금)이 setUp 의 TRUNCATE users … CASCADE 와 교착한다(ReadingLifecycleIT).
# - 클래스마다 이 속성들을 달리 적으면 Spring 테스트 컨텍스트 캐시 키가 갈려 컨텍스트가 그만큼 새로 뜬다.
# 켜야 하는 테스트만 클래스에서 =true 로 켠다. 스케줄러 자체는 *SchedulerTest 가 직접 만들거나 ApplicationContextRunner 로 띄워 본다(이 파일을 읽지 않는다).
ANALYSIS_WORKER_ENABLED=false
ACCOUNT_CLEANUP_ENABLED=false
ACCOUNT_HOUSEKEEPING_ENABLED=false
CHALLENGE_SETTLEMENT_ENABLED=false
CHALLENGE_NOTIFICATION_PUSH_ENABLED=false
CHALLENGE_VIEW_DIGEST_ENABLED=false
EXIT_SURVEY_SYNC_ENABLED=false
SCRIPT_UPLOAD_SWEEP_ENABLED=false
COMMUNITY_IMAGE_SWEEP_ENABLED=false
# 포스터 워커(보관함)는 저장소가 있는 테스트 컨텍스트마다 배경에서 영상을 집고 ffmpeg 를 부른다. 전역으로 끄고,
# 포스터를 보는 테스트는 워커를 직접 부른다(VideoLibraryIT).
VIDEO_POSTER_ENABLED=false
# 시한 지난 올리기 예약 정리도 같다. 정리를 보는 테스트는 VideoService.sweepExpiredIntents 를 직접 부른다(VideoLibraryIT, UploadIntentSweepIT).
UPLOAD_INTENT_SWEEP_ENABLED=false
# 오디션 공고 수집은 바깥 사이트에 요청을 보낸다. 기본이 꺼짐이지만 명시해 둔다 — 켜는 테스트(AuditionEndpointIT)는
# 출처를 메모리 가짜로 바꿔 끼운다.
AUDITION_ENABLED=false
CHALLENGE_MOSAIC_ENABLED=false
CHALLENGE_MODERATION_ENABLED=false

# 기존 회원 재동의 유예(manifest 의 reconsentFrom)를 끈다. 통합 테스트가 판 이름 v2 등을 임의의 새 판으로 쓰기 때문이다.
# 유예 동작은 ConsentServiceReconsentTest 가 일정을 직접 끼워 확인한다.
consent.reconsent-schedule.disabled=true
