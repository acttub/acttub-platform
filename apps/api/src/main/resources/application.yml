spring:
  application:
    name: acting-api
  # apps/api/CONTRACT.md §5 — Web MVC + virtual threads. WebFlux 는 쓰지 않는다.
  threads:
    virtual:
      enabled: true
  datasource:
    # url/username/password 는 DatabaseUrlEnvironmentPostProcessor 가 DATABASE_URL 에서 채운다.
    hikari:
      pool-name: acting-api-pool
      # 기본값 10 이면 디스크 확정이 잠깐 멈출 때 녹음 올리기의 COMMIT 이 연결을 다 쥐어, 관계없는 요청까지
      # 연결을 기다린다. dev 에서 10 과 30 을 번갈아 재어 정했다(SOMA-1113). DB 의 max_connections 는 100 이고
      # 배포 중에는 API 가 잠깐 둘이라 최대 60 이다.
      maximum-pool-size: 30
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 DB(dev·운영)는 애플리케이션이 아니라 별도 baseline 명령으로 기록한다.
    # 여기서 true 로 켜면 "빈 DB 가 아닌데 V1 을 건너뛰는" 판정을 애플리케이션이 조용히 내리게 된다.
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      # apps/api/CONTRACT.md §5-5 — 스키마는 Flyway 가 소유한다. create/update 는 절대 금지.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Hibernate 7 은 네이티브 쿼리의 date·timestamp 열을 java.time 으로 돌려준다. 저장소 코드가
        # java.sql.Date·Timestamp 를 기대하는 곳이 있어(instanceof 로 갈라 조용히 빠지는 곳 포함) Hibernate 6 과
        # 같게 java.sql 타입을 받는다. Hibernate 가 옛 동작을 지키려고 둔 호환 설정이다.
        query:
          native:
            prefer_jdbc_datetime_types: true
        # JSON 열(JsonNode 필드)을 Jackson 3 으로 읽고 쓴다. Hibernate 는 Jackson 2 가 classpath 에 있으면
        # (springdoc 이 끌고 온다) 그것을 먼저 고르는데, 필드 타입이 Jackson 3 JsonNode 라 그러면 저장 값이 깨진다.
        type:
          json_format_mapper: jackson3
  # JSON 은 Jackson 3 이다. 기본값이 Jackson 2 와 여럿 다르다(속성 이름 정렬, 뒤에 붙은 토큰 거부, 원시 타입
  # null 거부, enum toString 등). 응답·요청 해석을 옮기기 전과 같게 Boot 가 Jackson 2 에 주던 기본값을 쓴다
  # (JacksonDefaultsContractTest 가 고정한다).
  jackson:
    use-jackson2-defaults: true
    mapper:
      # 위 설정은 생성자 매개변수 이름 읽기를 끄지만, 옛 Jackson 2 매퍼는 parameter-names 모듈로 읽었다.
      detect-parameter-names: true
    # apps/api/CONTRACT.md §6 #3 — null 필드를 키째 실어보낸다. NON_NULL 을 전역으로 켜지 않는다.
    default-property-inclusion: always
    deserialization:
      # 전역 거부로 두고, unknown key 를 허용하는 5개 DTO 만
      # @JsonIgnoreProperties(ignoreUnknown = true) 로 연다 (apps/api/CONTRACT.md §6-3).
      # 반대 방향(전역 허용 + DTO 별 거부)은 Jackson 이 표현하지 못한다 —
      # ignoreUnknown=false 는 "전역을 따르라"는 뜻이라 거부를 강제하지 못한다.
      fail-on-unknown-properties: true
    datatype:
      datetime:
        write-dates-as-timestamps: false
    json:
      write:
        # Boot 가 만드는 Jackson 3 팩토리는 이모지 같은 BMP 밖 글자를 UTF-8 바이트로 바로 쓴다. Jackson 2 처럼
        # \uD83C\uDFAD 로 이스케이프한다(응답 바이트, CanonicalJson 요청 지문).
        combine-unicode-surrogates-in-utf8: false
    # Jackson 3·Boot 4 의 한도(중첩 500, 문자열 1억 자)를 Jackson 2.21 기본값으로 둔다. 요청 본문이 같은 데서
    # 같게 막힌다.
    factory:
      constraints:
        read:
          max-nesting-depth: 1000
          max-string-length: 20000000
        write:
          max-nesting-depth: 1000
  servlet:
    multipart:
      # 리딩 녹음 올리기(reading.recording)만 multipart 다. 파일 한도 10,000,000바이트는 핸들러가 422
      # recording_too_long 으로 보고, 그보다 훨씬 큰 것은 여기서 잘라 413 upload_too_large 다.
      max-file-size: 25MB
      max-request-size: 26MB
  web:
    resources:
      add-mappings: false
    # 요청이 Accept-Language 를 안 보내면 한국어로 본다. 장비의 기본 언어를 따라가면
    # 서버가 영어로 잡힌 순간 AI 가 영어로 답해 버린다.
    locale: ko
    locale-resolver: accept-header

# 파이썬 observability.py 와 같은 계약이다(docs/archive/soma287/M5-cutover.md §D).
#
# **DSN 이 없으면 켜지 않는다.** 빈 문자열은 Sentry SDK 가 "비활성화" 로 규정한 값이라
# (Sentry.initConfigurations 가 빈 DSN 을 받으면 close() 하고 끝낸다) 로컬·테스트는 기본으로
# 조용하다. 이 가드가 없으면 테스트가 이벤트를 밖으로 쏜다.
#
# 릴리스는 커밋 SHA 다. deploy/home/deploy.sh 가 release.env 를 쓰고
# Compose 가 API 컨테이너의 환경변수로 주입한다.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:unknown}
  # 쿠키·헤더·IP·요청 본문을 SDK 가 알아서 담지 않게 한다. 주소는 이 대상이 아니라서
  # UrlScrubbingCallback 이 따로 지운다.
  send-default-pii: false
  # 1단계는 에러만 본다. 트레이싱은 켜지 않는다.
  traces-sample-rate: 0.0

acttub:
  coach:
    # 발표 시연용 정해진 코칭(coaching/scripted/demo.json). 이 이메일의 영상 코칭은 모델을 부르지 않고 대본을 순서대로 낸다. 발표가 끝나 기본은 끈다(11/23).
    scripted:
      enabled: ${ACTTUB_COACH_SCRIPTED_ENABLED:false}
      emails: ${ACTTUB_COACH_SCRIPTED_EMAILS:sukpower198919@gmail.com}
      first-delay-ms: ${ACTTUB_COACH_SCRIPTED_FIRST_DELAY_MS:4000}
      next-delay-ms: ${ACTTUB_COACH_SCRIPTED_NEXT_DELAY_MS:1500}

springdoc:
  api-docs:
    # 기존 spec 이 3.1.0 이다. const/anyOf 표현이 3.0 과 다르므로 맞춘다.
    version: openapi_3_1
    path: /v3/api-docs
    # 기본으로도 켜져 있다. springdoc 3 은 이 값을 적지 않으면 기동 때마다 "기본으로 켜져 있다" 경고를 남긴다.
    enabled: true
  swagger-ui:
    enabled: true

server:
  port: 8080

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:-1}
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health,prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      show-components: always
  metrics:
    observations:
      # Boot 4.2 부터 기본이 꺼짐이다. 켜 두어 *_active_seconds 지표(진행 중 요청·작업)를 Boot 3.5 때와 같게 낸다.
      include-active-long-task-timer: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s,10s,30s,60s

logging:
  level:
    org.flywaydb: INFO
    # 대본 PDF 의 글리프마다 「No Unicode mapping」 경고를 낸다. 못 읽은 글자는 글에서 빠질 뿐이다(reading.script 원본 파일).
    org.apache.pdfbox: ERROR
