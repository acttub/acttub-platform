[project]
name = "acting-summary"
version = "0.1.0"
description = "영상 + 서브텍스트 → Gemini 통합 요약 (다음 단계 LLM 입력용)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "acting-llm",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "google-genai>=2.9.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
acting-llm = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
markers = [
    "gemini: 실제 Gemini API 호출 (opt-in, 기본 skip)",
]
