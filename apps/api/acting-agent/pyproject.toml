[project]
name = "acting-agent"
version = "0.1.0"
description = "연기 요약(SceneSummary) 기반 대화형 코치 에이전트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "acting-llm",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.9",
]

[tool.uv.sources]
acting-llm = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
]
