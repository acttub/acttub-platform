[project]
name = "acting-llm"
version = "0.1.0"
description = "Acttub shared LLM, safety, validation, and media utilities"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
