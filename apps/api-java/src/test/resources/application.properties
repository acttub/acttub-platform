# 테스트 전용 설정. 운영 동작을 바꾸지 않는다.
#
# 테스트 클래스마다 DB 이름이 달라 Spring 컨텍스트가 클래스 단위로 새로 뜨고, 캐시된
# 컨텍스트들이 각자 Hikari 풀을 계속 들고 있다. 기본 풀 크기(10)를 그대로 두면 클래스가
# 늘어날수록 커넥션이 선형으로 쌓여 Postgres 가 "too many clients already" 로 거절하고,
# 구현과 무관한 실패가 무더기로 난다. 테스트는 동시성 케이스에서도 커넥션을 몇 개만 쓰므로
# 상한을 좁혀 둔다. 컨테이너 쪽 max_connections 는 PostgresContainerSupport 가 올린다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
