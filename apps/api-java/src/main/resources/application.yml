spring:
  application:
    name: acting-api
  # /SPEC.md §2 — Web MVC + virtual threads. WebFlux 는 쓰지 않는다.
  threads:
    virtual:
      enabled: true
  datasource:
    # url/username/password 는 DatabaseUrlEnvironmentPostProcessor 가 DATABASE_URL 에서 채운다.
    hikari:
      pool-name: acting-api-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 DB(dev·운영)는 애플리케이션이 아니라 별도 baseline 명령으로 기록한다.
    # 여기서 true 로 켜면 "빈 DB 가 아닌데 V1 을 건너뛰는" 판정을 애플리케이션이 조용히 내리게 된다.
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      # /SPEC.md §2 — 스키마는 Flyway 가 소유한다. create/update 는 절대 금지.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    # /SPEC.md §6 #3 — null 필드를 키째 실어보낸다. NON_NULL 을 전역으로 켜지 않는다.
    default-property-inclusion: always
    deserialization:
      # 전역 거부로 두고, unknown key 를 허용하는 5개 DTO 만
      # @JsonIgnoreProperties(ignoreUnknown = true) 로 연다 (/SPEC.md §6-3).
      # 반대 방향(전역 허용 + DTO 별 거부)은 Jackson 이 표현하지 못한다 —
      # ignoreUnknown=false 는 "전역을 따르라"는 뜻이라 거부를 강제하지 못한다.
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true

# 파이썬 observability.py 와 같은 계약이다(spec/M5-cutover.md §D).
#
# **DSN 이 없으면 켜지 않는다.** 빈 문자열은 Sentry SDK 가 "비활성화" 로 규정한 값이라
# (Sentry.initConfigurations 가 빈 DSN 을 받으면 close() 하고 끝낸다) 로컬·테스트는 기본으로
# 조용하다. 이 가드가 없으면 테스트가 이벤트를 밖으로 쏜다.
#
# 환경변수 이름과 주입 경로는 파이썬과 같게 유지한다 — 릴리스는 커밋 SHA 이고
# deploy/ssm-deploy.sh 가 systemd drop-in 으로 넣는다.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:unknown}
  # 쿠키·헤더·IP·요청 본문을 SDK 가 알아서 담지 않게 한다. 주소는 이 대상이 아니라서
  # UrlScrubbingCallback 이 따로 지운다.
  send-default-pii: false
  # 1단계는 에러만 본다. 트레이싱은 켜지 않는다.
  traces-sample-rate: 0.0

springdoc:
  api-docs:
    # 기존 spec 이 3.1.0 이다. const/anyOf 표현이 3.0 과 다르므로 맞춘다.
    version: openapi_3_1
    path: /v3/api-docs

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO
