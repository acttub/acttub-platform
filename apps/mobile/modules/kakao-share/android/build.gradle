plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.acttub'
version = '1.0.0'

// 카카오 로그인(@react-native-seoul/kakao-login)과 같은 카카오 SDK 판을 쓴다. 판이 갈리면 v2-common 이 한쪽으로 올라가
// 다른 쪽이 깨질 수 있다. 저장소(devrepo.kakao.com)는 app.json 의 expo-build-properties extraMavenRepos 가 넣는다.
def kakaoSdkVersion = rootProject.ext.has('kakaoSdkVersion') ? rootProject.ext.get('kakaoSdkVersion') : '2.24.0'

android {
  namespace "com.acttub.kakaoshare"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "com.kakao.sdk:v2-share:${kakaoSdkVersion}"
}
