plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.acttub'
version = '1.0.0'

android {
  namespace "com.acttub.readinglive"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // 헤드리스 JS 작업(배경 타이머 유지)에 쓴다. 버전은 앱의 React Native 를 따른다.
  implementation 'com.facebook.react:react-android'
}
