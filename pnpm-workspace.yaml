packages:
  - "apps/*"
  - "!apps/mobile" # Expo RN 앱 — npm/EAS로 자립 관리(pnpm 심링크가 Metro를 깨서 워크스페이스 제외)
  - "packages/*"

overrides:
  tmp: 0.2.7
  uuid: 11.1.1
  # openapi-typescript 가 쓰는 @redocly/openapi-core 1.34.17 이 4.2.0 으로 못 박았다. 4.3.2 가 high 경보 셋을 고친다.
  '@redocly/openapi-core>js-yaml': 4.3.2

allowBuilds:
  # 소스맵 업로드에 쓰는 네이티브 바이너리를 postinstall에서 받는다. 막으면 빌드는
  # 통과하지만 업로드 단계에서 스택트레이스가 난독화된 채로 남는다.
  '@sentry/cli': true
  # posthog-js(웹 제품 계측)가 끌고 온다. 설치 스크립트는 후원 안내 문구를 찍을 뿐이다.
  core-js: false
  # onnxruntime-web(상대역 리딩)이 끌고 온다. 설치 스크립트는 코드 생성용이라 우리 쪽에서 쓸 일이 없다.
  protobufjs: false
  sharp: true
  unrs-resolver: true
