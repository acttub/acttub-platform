# SonarQube Cloud 분석 설정(SOMA-702). CI 의 sonar 잡이 읽습니다.
sonar.organization=acttub
sonar.projectKey=acttub_acttub-platform

sonar.sources=apps/api/src/main/java,apps/web/src,apps/mobile/app,apps/mobile/lib,apps/mobile/components,apps/mobile/hooks,apps/mobile/store,apps/mobile/constants
sonar.tests=apps/api/src/test/java,apps/web/tests,apps/mobile/tests
sonar.exclusions=**/*.d.ts,**/*.png,**/*.ico,**/*.ttf
sonar.java.binaries=apps/api/build/classes/java/main

# 경로는 sonar 잡이 artifact 를 받아 둔 자리입니다. JaCoCo 와 같이 schema(JPA 엔티티·JpaConverter)는 커버리지에서 뺍니다.
sonar.coverage.jacoco.xmlReportPaths=coverage-reports/coverage-api/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=coverage-reports/coverage-web/lcov.info,coverage-reports/coverage-mobile/lcov.info,coverage-reports/coverage-mobile/jest.lcov.info
sonar.coverage.exclusions=apps/api/src/main/java/**/schema/**
