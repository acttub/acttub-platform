name: GHCR 로그인 · 같은 sha 이미지 확인
description: push 에 쓸 GHCR 로그인을 하고, 같은 태그의 이미지가 이미 있는지 exists 로 알립니다.
inputs:
  image:
    description: 확인할 이미지 참조 (ghcr.io/…:<sha>)
    required: true
  rebuild:
    description: 값이 "true" 면 이미지가 있어도 exists=false 로 둡니다.
    required: true
outputs:
  exists:
    description: 이미 있으면 "true", 구워야 하면 "false"
    value: ${{ steps.exists.outputs.exists }}
runs:
  using: composite
  steps:
    - name: GHCR 로그인
      shell: bash
      env:
        TOKEN: ${{ github.token }}
      run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

    - name: 같은 sha 이미지가 이미 있는지
      id: exists
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REBUILD: ${{ inputs.rebuild }}
      run: |
        set -euo pipefail
        if [ "$REBUILD" = "true" ]; then
          echo "rebuild_images — 있어도 다시 굽습니다: $IMAGE"
          echo "exists=false" >> "$GITHUB_OUTPUT"
        elif deploy/ghcr-image-exists.sh "$IMAGE"; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          rc=$?; [ "$rc" = 1 ] || exit "$rc"
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
