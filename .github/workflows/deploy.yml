# VPC 인프라 배포 — 빌드·S3 업로드·SSM 설치를 한 번에 수행합니다.
#
# dev·prod 두 환경이 같은 잡을 씁니다. 환경별로 다른 값(버킷·인스턴스 ID·API_ORIGIN)은
# GitHub Environments의 variables가 담당하므로, 워크플로 안에는 환경 분기가 없습니다.
#   - dev  : dev 브랜치에 머지되면 자동 배포. 인스턴스 한 대에 web·api가 함께 뜹니다.
#   - prod : Actions 탭에서 수동 실행. 인스턴스가 fe·be로 나뉩니다.
#
# 인증은 OIDC입니다. 장기 액세스 키를 repo Secrets에 두지 않고, 실행할 때마다
# AWS에서 임시 자격증명을 받습니다. 설정 절차는 docs/DEPLOY-VPC.md 7장 참고.
#
# 인스턴스에 SSH로 접속하지 않습니다 — SSM Run Command로 AWS에 실행을 위임하므로
# private subnet이어도 runner에서 그대로 동작합니다.
name: Deploy

on:
  # 머지 즉시 반영합니다. 브랜치가 곧 환경입니다 — dev→dev, main→운영.
  # 두 브랜치 모두 들어오는 경로는 PR뿐이고 그 PR은 ci.yml 게이트를 통과했으므로,
  # 여기서 테스트를 다시 돌리지 않습니다.
  #
  # main 자동 배포는 운영 배포의 최대 위험이던 ref 오선택을 원천 제거합니다
  # (6-5 참고 — Actions UI 드롭다운 기본값이 dev라 세 번 잘못 나갔습니다).
  # 대신 main 머지가 곧 릴리스이므로, 머지 전에 되돌릴 여지를 확보해야 합니다.
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [dev, prod]
        default: dev
      target:
        description: 배포 대상
        type: choice
        # be-java 가 백엔드 배포입니다. dev·운영 모두 프록시 대상이 8080 이라 이 잡이
        # 곧 트래픽을 받는 프로세스를 갱신합니다(운영 컷오버까지 완료, 2026-08-17).
        # 파이썬은 더 이상 배포에 실리지 않습니다 — 스키마 정본이 Flyway 로 넘어가
        # 마이그레이션이 jar 기동의 일부가 됐습니다(SOMA-403 3단계).
        options: [fe, be-java, both, be-java-baseline]
        default: both

# 배포는 겹치면 안 됩니다. 진행 중인 배포를 취소하면 인스턴스가 절반만 갱신된
# 상태로 남을 수 있으므로 cancel-in-progress를 켜지 않습니다.
# dev 배포가 prod 배포를 막지 않도록 환경별로 그룹을 나눕니다.
#
# 워크플로 레벨이라 잡 output(guard)을 참조할 수 없어 판정식을 인라인으로 둡니다.
# guard의 '배포 환경 판정' 스텝과 같은 규칙이어야 합니다.
concurrency:
  group: deploy-${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC 토큰 발급에 필요 — 없으면 role assume이 실패합니다.
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  # 배포 환경을 여기서 한 번만 정하고, 나머지 잡은 이 output만 봅니다.
  #
  # push 이벤트에서는 inputs.*가 전부 비어 있습니다. 그래서 판정을 각 잡에
  # 흩어두면 main에 push해도 dev 환경으로 나가는 사고가 납니다.
  #
  # workflow_dispatch는 "어디에 배포할까"(environment)와 "무엇을 배포할까"(ref)를
  # 따로 받습니다. ref는 Actions UI의 브랜치 드롭다운이 정하는데 기본값이
  # default branch(dev)라, 운영 배포를 하면서 브랜치를 바꾸지 않으면 운영 서버에
  # dev 브랜치 코드가 올라갑니다. 2026-08-01에 실제로 세 번 그렇게 나갔고,
  # main에 없는 마이그레이션이 운영에 실려 커뮤니티 API가 며칠간 500이었습니다.
  # main 자동 배포가 생긴 지금 이 함정은 수동 실행 경로에만 남아 있습니다.
  guard:
    name: 사전 점검
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      # ref 검사보다 앞에 둡니다 — guard가 막혀도 notify가 어느 환경이었는지
      # 말할 수 있어야 합니다.
      - name: 배포 환경 판정
        id: env
        env:
          INPUT_ENV: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_ENV" ]; then
            resolved="$INPUT_ENV"          # 수동 실행은 입력이 우선입니다
          elif [ "$REF_NAME" = "main" ]; then
            resolved=prod                  # 브랜치가 곧 환경입니다
          else
            resolved=dev
          fi
          echo "environment=$resolved" >> "$GITHUB_OUTPUT"
          echo "배포 환경: $resolved (ref: $REF_NAME)"

      - name: 운영 배포는 main에서만
        if: ${{ steps.env.outputs.environment == 'prod' && github.ref_name != 'main' }}
        run: |
          echo "::error::운영 배포는 main 브랜치에서만 실행할 수 있습니다 (현재 ref: ${{ github.ref_name }})."
          echo "Actions 탭의 'Use workflow from' 을 main 으로 바꾸거나," >> $GITHUB_STEP_SUMMARY
          echo '`gh workflow run deploy.yml --ref main -f environment=prod` 로 실행하세요.' >> $GITHUB_STEP_SUMMARY
          exit 1

  # 백엔드 배포입니다. 2026-08-17 운영 컷오버(SOMA-394)까지 끝나 dev·운영 모두
  # 프록시 대상이 8080 이므로, 이 잡이 곧 트래픽을 받는 프로세스를 갱신합니다.
  #
  # inputs.target은 push 이벤트에서 비어 있습니다. push는 곧 전체 배포이므로
  # 기본값 both를 씁니다. 환경은 guard가 판정한 값 하나만 봅니다.
  #
  # **파이썬은 배포에 실리지 않습니다.** 스키마 정본이 Flyway 로 넘어가(SOMA-403 3단계)
  # 마이그레이션이 jar 기동의 일부가 됐습니다 — 별도 migrate 스텝이 없습니다.
  #
  # 그래서 "코드는 새것·DB는 구것" 인 창이 구조적으로 사라집니다. 마이그레이션이 실패하면
  # 앱이 아예 리슨을 시작하지 못하고, 아래 `Install on instance` 의 health·NRestarts 검사가
  # 그것을 배포 실패로 보고합니다. alembic 시절에는 마이그레이션이 별도 스텝이라 부분
  # 적용이 성공으로 읽힐 수 있었고(2026-08-01 커뮤니티 500), `check-migration.sh` 가 그
  # 창을 사후에 대조했습니다.
  #
  # ⚠ **되돌리기 어려운 것은 그대로입니다.** 스키마를 먼저 넓히고 코드를 나중에 좁히는
  # 순서로 통제합니다(docs/DEPLOY-VPC.md 6-4).
  be_java:
    name: back svc (Spring Boot)
    needs: guard
    environment: ${{ needs.guard.outputs.environment }}
    if: ${{ (inputs.target || 'both') == 'both' || inputs.target == 'be-java' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package & upload (jar)
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: deploy/upload-api-java.sh

      # jar 하나가 아티팩트의 전부입니다. 마이그레이션은 이 스텝 안에서, 앱이 뜨는
      # 도중에 Flyway 가 돌립니다.
      - name: Install on instance
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          # 빠뜨리면 ssm-deploy.sh 의 drop-in 이 둘 다 unknown 으로 박습니다 —
          # Sentry 에서 어느 커밋인지 알 수 없고(SENTRY_RELEASE), /health 의 commit 도
          # unknown 으로 남아 배포된 프로세스를 밖에서 확인할 수 없습니다(SOMA-401).
          RELEASE: ${{ github.sha }}
        run: deploy/ssm-deploy.sh be-java ${{ vars.BE_INSTANCE_ID }}

  # 스키마는 있는데 flyway_schema_history 가 없는 DB 마다 최초 1회. dev·운영이 그렇습니다
  # (alembic 이 스키마를 만들었습니다). 마이그레이션은 실행하지 않고 기록만 남깁니다.
  #
  # 빈 DB 에서 시작하는 신규 환경·재해복구에는 필요 없습니다 — 거기서는 Flyway 가 V1 부터
  # 그대로 적용합니다(spec/M6-findings.md §3).
  be_java_baseline:
    name: back svc (Spring Boot) Flyway baseline
    needs: guard
    environment: ${{ needs.guard.outputs.environment }}
    if: ${{ inputs.target == 'be-java-baseline' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Baseline on instance
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: deploy/ssm-deploy.sh be-java-baseline ${{ vars.BE_INSTANCE_ID }}

  fe:
    name: front svc (Next 서버)
    needs: guard
    # environment를 지정하면 GitHub가 Deployment 이벤트를 남기고, GitHub for Jira
    # 앱이 이를 Jira로 넘겨 이슈 화면에 배포 이력이 붙습니다.
    environment: ${{ needs.guard.outputs.environment }}
    if: ${{ (inputs.target || 'both') == 'both' || inputs.target == 'fe' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 계측 키를 넣는 것과 방침에 고지하는 것은 순서를 틀리면 되돌릴 수 없습니다.
      # 키가 먼저 들어가면 고지 없이 이용 기록과 화면 녹화가 수탁사로 넘어갑니다.
      # 사람이 기억할 일로 두지 않고 여기서 막습니다. 키가 비어 있으면 통과합니다 —
      # 계측이 꺼진 번들이 나갈 뿐이라 안전한 상태입니다.
      - name: 계측 키가 방침 고지보다 앞서지 않는지
        env:
          AMPLITUDE_KEY: ${{ vars.AMPLITUDE_API_KEY_WEB }}
        run: |
          set -euo pipefail
          if [ -z "${AMPLITUDE_KEY:-}" ]; then
            echo "Amplitude 키가 없습니다 — 계측이 꺼진 번들로 배포합니다."
            exit 0
          fi

          MANIFEST=apps/api/src/main/resources/consent-docs/manifest.json
          PRIVACY_FILE=$(jq -r '.[] | select(.type=="privacy") | .file' "$MANIFEST")
          PRIVACY_VERSION=$(jq -r '.[] | select(.type=="privacy") | .version' "$MANIFEST")
          PRIVACY_PATH="apps/api/src/main/resources/consent-docs/$PRIVACY_FILE"

          if ! grep -q "Amplitude" "$PRIVACY_PATH"; then
            echo "::error::발행 중인 개인정보처리방침($PRIVACY_FILE)에 Amplitude 위탁 고지가 없는데 계측 키가 설정돼 있습니다."
            {
              echo "### 배포를 멈췄습니다"
              echo "\`$PRIVACY_FILE\` 에 Amplitude 가 없습니다. 이대로 나가면 고지 없이 이용 기록과"
              echo "화면 녹화가 수탁사로 전송됩니다."
              echo ""
              echo "**둘 중 하나를 하세요.**"
              echo "1. 방침을 먼저 발행한다 — \`apps/api/src/main/resources/consent-docs/README.md\` 의 순서를 따르세요."
              echo "2. 지금 배포에서 계측을 끈다 — 이 환경의 \`AMPLITUDE_API_KEY_WEB\` 변수를 비우세요."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          EXPECTED=$(grep -oE 'EXPECTED_PRIVACY_VERSION = "[^"]+"' apps/web/src/features/auth/pending-consents.ts | grep -oE '"[^"]+"' | tr -d '"')
          if [ "$EXPECTED" != "$PRIVACY_VERSION" ]; then
            echo "::error::웹이 기대하는 방침 버전($EXPECTED)과 발행 중인 버전($PRIVACY_VERSION)이 다릅니다."
            {
              echo "### 배포를 멈췄습니다"
              echo "\`EXPECTED_PRIVACY_VERSION\` = \`$EXPECTED\`, manifest 발행 버전 = \`$PRIVACY_VERSION\`."
              echo "이 둘이 어긋나면 동의 게이트가 영영 열리지 않거나(계측이 조용히 죽음),"
              echo "옛 버전 동의자에게 새 수집을 적용하게 됩니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "방침 $PRIVACY_VERSION($PRIVACY_FILE)에 Amplitude 고지가 있고 웹 기대 버전과 일치합니다."

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 빌드 → sharp 제외 → 정적 자산 병합 → *.node 잔존 검사 → S3 업로드.
      # API_ORIGIN은 빌드 시점에 routes-manifest로 굳으므로 여기서 주어야 합니다.
      - name: Build & upload
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # Sentry도 빌드 시점에 굳습니다. DSN이 비어 있으면 계측이 꺼진 번들이
          # 나가는데, 빌드는 통과하므로 배포가 초록이어도 에러가 안 올라옵니다.
          # 릴리스는 소스맵 업로드와 런타임이 같은 값을 봐야 스택트레이스가 풀립니다.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
          NEXT_PUBLIC_SENTRY_ENV: ${{ needs.guard.outputs.environment }}
          NEXT_PUBLIC_APP_COMMIT: ${{ github.sha }}
          # Amplitude도 빌드 시점에 굳습니다. 키가 비면 계측이 꺼진 번들이 나갑니다.
          # dev와 운영에 서로 다른 프로젝트 키를 넣어 통계를 나눕니다 — 호스트로
          # 거르지 않으므로 같은 키를 두 환경에 주면 데이터가 한 프로젝트에 섞입니다.
          # ⚠️ 개인정보처리방침에 Amplitude 위탁이 발행되기 전에는 비워 둡니다.
          NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY_WEB }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WEB }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: deploy/upload-web.sh

      - name: Install on instance
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: deploy/ssm-deploy.sh fe ${{ vars.FE_INSTANCE_ID }}

  # 배포 결과를 Slack #배포알림 으로 보냅니다. dev는 실패만, 운영은 성공도 알립니다.
  # dev는 머지마다 돌아 월 60회가 넘으므로, 성공까지 보내면 두 주 만에 아무도 보지
  # 않게 되고 정작 실패가 묻힙니다.
  notify:
    name: 결과 통지
    needs: [guard, fe, be_java, be_java_baseline]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 통지가 실패해도 배포 결과를 덮지 않게 합니다 — Slack이 죽어도 배포는 초록입니다.
    continue-on-error: true
    steps:
      - name: Slack 통지
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          # guard가 실패하면 output이 비므로 표시용 기본값을 둡니다.
          ENVIRONMENT: ${{ needs.guard.outputs.environment || 'dev' }}
          GUARD: ${{ needs.guard.result }}
          FE: ${{ needs.fe.result }}
          BE_JAVA: ${{ needs.be_java.result }}
          BE_JAVA_BASELINE: ${{ needs.be_java_baseline.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # 시크릿이 없는 포크·초기 상태에서도 워크플로가 깨지지 않게 조용히 넘어갑니다.
          if [ -z "${WEBHOOK}" ]; then
            echo "SLACK_WEBHOOK_DEPLOY 미설정 — 통지를 건너뜁니다."
            exit 0
          fi

          # skipped 는 실패가 아닙니다. target=fe 배포에서는 be_java 가, guard 가
          # 막으면 fe·be_java 둘 다 skipped 로 남습니다.
          failed=""
          if [ "$GUARD" = "failure" ]; then failed="${failed} 사전점검"; fi
          if [ "$FE" = "failure" ]; then failed="${failed} front"; fi
          if [ "$BE_JAVA" = "failure" ]; then failed="${failed} back(java)"; fi
          if [ "$BE_JAVA_BASELINE" = "failure" ]; then failed="${failed} back(java baseline)"; fi
          if [ "$GUARD" = "cancelled" ] || [ "$FE" = "cancelled" ] \
            || [ "$BE_JAVA" = "cancelled" ] || [ "$BE_JAVA_BASELINE" = "cancelled" ]; then
            failed="${failed} (일부 취소됨)"
          fi

          if [ -n "$failed" ]; then
            color="danger"
            head=":rotating_light: *${ENVIRONMENT} 배포 실패* —${failed}"
          elif [ "$FE" = "skipped" ] && [ "$BE_JAVA" != "skipped" ]; then
            # 백엔드만 올린 실행입니다. dev·운영 모두 프록시 대상이 8080 이라
            # 이것만으로 트래픽을 받는 프로세스가 갈립니다 — 화면은 그대로라는 뜻입니다.
            color="good"
            head=":package: *${ENVIRONMENT} 백엔드(자바)만 갱신* (화면 변경 없음)"
          elif [ "$ENVIRONMENT" = "prod" ]; then
            color="good"
            head=":white_check_mark: *운영 배포 완료*"
          else
            echo "dev 배포 성공 — 통지하지 않습니다."
            exit 0
          fi

          text="${head}"$'\n'"<${RUN_URL}|실행 로그> · \`${GITHUB_SHA:0:7}\` · ${GITHUB_ACTOR}"

          # 브랜치명·커밋에 따옴표가 섞여도 깨지지 않도록 payload 는 jq 로 만듭니다.
          jq -n --arg t "$text" --arg c "$color" \
            '{attachments:[{color:$c, text:$t, mrkdwn_in:["text"]}]}' \
            | curl -sS -X POST -H 'Content-type: application/json' --data @- "$WEBHOOK"
