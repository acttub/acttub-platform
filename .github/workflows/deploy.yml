# 배포 — 환경마다 길이 다릅니다(SOMA-489 PR ①, 2026-09-03).
#
#   - dev  : dev 브랜치에 머지되면 자동. 컨테이너 이미지 둘(api·web)을 GHCR 에 올리고, 러너가
#            Tailscale 임시 노드로 홈서버(insung-server)의 deploy 계정에 SSH 해 docker compose
#            스택(web·api·db·cloudflared)을 갱신합니다(deploy/home/deploy.sh).
#   - prod : main 브랜치에 머지되면 자동. 아직 AWS VPC 경로 — 빌드·S3 업로드·SSM 설치(be_java·fe).
#            2주 관찰 뒤 PR ② 에서 홈서버 길로 바꾸고 S3+SSM 잡을 지웁니다.
#
# 인증도 둘입니다. prod 는 OIDC 라 장기 액세스 키를 repo Secrets 에 두지 않고 실행할 때마다 AWS 에서
# 임시 자격증명을 받습니다(docs/deploy/DEPLOY-VPC.md 6-1·6-2). dev 서버의 열쇠는 Tailscale OAuth
# 클라이언트(TS_OAUTH_CLIENT_ID·TS_OAUTH_SECRET) 하나뿐입니다 — 러너가 tag:ci 임시 노드가 되어 Tailscale
# SSH 로 들어가므로 SSH 개인키도 서버 IP 도 secrets 에 없습니다.
name: Deploy

on:
  # 머지 즉시 반영합니다. 브랜치가 곧 환경입니다 — dev→dev, main→운영.
  # 두 브랜치 모두 들어오는 경로는 PR뿐이고 그 PR은 ci.yml 게이트를 통과했으므로,
  # 여기서 테스트를 다시 돌리지 않습니다.
  #
  # main 자동 배포는 운영 배포의 최대 위험이던 ref 오선택을 원천 제거합니다
  # (6-5 참고 — Actions UI 드롭다운 기본값이 dev라 세 번 잘못 나갔습니다).
  # 대신 main 머지가 곧 릴리스이므로, 머지 전에 되돌릴 여지를 확보해야 합니다.
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [dev, prod]
        default: dev
      target:
        description: 배포 대상 (prod 전용 — dev 홈서버는 compose 스택 전체를 배포합니다)
        type: choice
        # be-java 가 백엔드 배포입니다. dev·운영 모두 프록시 대상이 8080 이라 이 잡이
        # 곧 트래픽을 받는 프로세스를 갱신합니다(운영 컷오버까지 완료, 2026-08-17).
        # 파이썬은 더 이상 배포에 실리지 않습니다 — 스키마 정본이 Flyway 로 넘어가
        # 마이그레이션이 jar 기동의 일부가 됐습니다(SOMA-403 3단계).
        options: [fe, be-java, both, be-java-baseline]
        default: both
      rebuild_images:
        description: GHCR 에 같은 sha 이미지가 있어도 다시 굽습니다 (dev 홈서버 — GitHub 변수를 바꾼 뒤 같은 커밋을 재배포할 때)
        type: boolean
        default: false

# 배포는 겹치면 안 됩니다. 진행 중인 배포를 취소하면 인스턴스가 절반만 갱신된
# 상태로 남을 수 있으므로 cancel-in-progress를 켜지 않습니다.
# dev 배포가 prod 배포를 막지 않도록 환경별로 그룹을 나눕니다.
#
# 워크플로 레벨이라 잡 output(guard)을 참조할 수 없어 판정식을 인라인으로 둡니다.
# guard의 '배포 환경 판정' 스텝과 같은 규칙이어야 합니다.
concurrency:
  group: deploy-${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC 토큰 발급에 필요 — 없으면 role assume이 실패합니다.
  contents: read
  # packages: write 는 GHCR 에 올리는 build_api·build_web 잡에만 줍니다(잡 레벨 permissions).

env:
  AWS_REGION: ap-northeast-2

jobs:
  # 배포 환경을 여기서 한 번만 정하고, 나머지 잡은 이 output만 봅니다.
  #
  # push 이벤트에서는 inputs.*가 전부 비어 있습니다. 그래서 판정을 각 잡에
  # 흩어두면 main에 push해도 dev 환경으로 나가는 사고가 납니다.
  #
  # workflow_dispatch는 "어디에 배포할까"(environment)와 "무엇을 배포할까"(ref)를
  # 따로 받습니다. ref는 Actions UI의 브랜치 드롭다운이 정하는데 기본값이
  # default branch(dev)라, 운영 배포를 하면서 브랜치를 바꾸지 않으면 운영 서버에
  # dev 브랜치 코드가 올라갑니다. 2026-08-01에 실제로 세 번 그렇게 나갔고,
  # main에 없는 마이그레이션이 운영에 실려 커뮤니티 API가 며칠간 500이었습니다.
  # main 자동 배포가 생긴 지금 이 함정은 수동 실행 경로에만 남아 있습니다.
  guard:
    name: 사전 점검
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      api_image: ${{ steps.env.outputs.api_image }}
      web_image: ${{ steps.env.outputs.web_image }}
    steps:
      # ref 검사보다 앞에 둡니다 — guard가 막혀도 notify가 어느 환경이었는지
      # 말할 수 있어야 합니다.
      - name: 배포 환경 판정
        id: env
        env:
          INPUT_ENV: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_ENV" ]; then
            resolved="$INPUT_ENV"          # 수동 실행은 입력이 우선입니다
          elif [ "$REF_NAME" = "main" ]; then
            resolved=prod                  # 브랜치가 곧 환경입니다
          else
            resolved=dev
          fi
          echo "environment=$resolved" >> "$GITHUB_OUTPUT"
          echo "배포 환경: $resolved (ref: $REF_NAME)"

          # 이미지 이름도 여기서 한 번만 정합니다. GHCR 은 소문자 이름만 받으므로 저장소 이름을
          # 내립니다. api 는 설정을 전부 런타임 env 로 받아 환경 무관 이미지 하나(api:<sha>)이고,
          # web 은 사이트 URL·Sentry·Amplitude 가 빌드에 굳어 환경별입니다(web:<env>-<sha>).
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api_image=$base/api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "web_image=$base/web:$resolved-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: 운영 배포는 main에서만
        if: ${{ steps.env.outputs.environment == 'prod' && github.ref_name != 'main' }}
        run: |
          echo "::error::운영 배포는 main 브랜치에서만 실행할 수 있습니다 (현재 ref: ${{ github.ref_name }})."
          echo "Actions 탭의 'Use workflow from' 을 main 으로 바꾸거나," >> "$GITHUB_STEP_SUMMARY"
          echo '`gh workflow run deploy.yml --ref main -f environment=prod` 로 실행하세요.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # 홈서버 dev 는 compose 스택 하나라 부분 배포가 없습니다 — target 은 prod(fe·be_java) 전용입니다.
      # baseline 은 dev 에 없습니다: dev DB 는 Flyway 이력째 옮겨 오는 것이라(SOMA-489 06) 기록할 것이 없습니다.
      - name: 홈서버 dev 는 target 을 모릅니다
        if: ${{ steps.env.outputs.environment == 'dev' && (inputs.target || 'both') != 'both' }}
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          if [ "$INPUT_TARGET" = "be-java-baseline" ]; then
            echo "::error::홈서버 dev 에는 Flyway baseline 타깃이 없습니다 — DB 를 이력째 옮겨 오므로 baseline 이 필요 없습니다."
            exit 1
          fi
          echo "::notice::홈서버 dev 는 target($INPUT_TARGET)을 무시하고 web·api 전체를 배포합니다."

  # ── dev — 홈서버 길: 이미지 둘 → GHCR → Tailscale SSH → compose ──────────────────────
  #
  # 이미지는 커밋 sha 로 태그합니다. 같은 sha 가 GHCR 에 이미 있으면 굽지 않습니다 — 다시 구우면
  # jar 의 타임스탬프와 Next 의 빌드 ID 가 달라져 다이제스트가 바뀌고, 서버의 compose 가 같은 코드를
  # 새 컨테이너로 다시 띄웁니다. 건너뛰어야 "같은 sha 재실행 = 무변경" 이 성립합니다. 웹 설정은
  # 이미지에 굳어 있어 sha 만으로는 GitHub 변수(vars.*)가 바뀐 것을 모릅니다 — 그때는 수동 실행의
  # rebuild_images 를 켭니다.
  #
  # 이미지는 공개(GHCR public)입니다. 들어가는 값은 public 레포의 빌드 결과와 이미 브라우저에 내려가는
  # 공개값뿐이고, 서버는 로그인 없이 pull 합니다. 러너와 서버가 둘 다 x86_64 라 단일 플랫폼입니다.
  build_api:
    name: 이미지 · api (GHCR)
    needs: guard
    if: ${{ needs.guard.outputs.environment == 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # GHCR push. 로그인은 GITHUB_TOKEN 입니다.
    steps:
      - uses: actions/checkout@v7

      - name: GHCR 로그인
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # deploy/ghcr-image-exists.sh — 0 있다 · 1 없다 · 2 판정 불가(레지스트리 오류는 다시 굽지 않고 실패).
      - name: 같은 sha 이미지가 이미 있는지
        id: exists
        env:
          IMAGE: ${{ needs.guard.outputs.api_image }}
          REBUILD: ${{ inputs.rebuild_images }}
        run: |
          set -euo pipefail
          if [ "$REBUILD" = "true" ]; then
            echo "rebuild_images — 있어도 다시 굽습니다: $IMAGE"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif deploy/ghcr-image-exists.sh "$IMAGE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?; [ "$rc" = 1 ] || exit "$rc"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: ${{ steps.exists.outputs.exists != 'true' }}
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ steps.exists.outputs.exists != 'true' }}

      # jar 는 러너에서 만들고 Dockerfile 은 COPY 만 합니다(apps/api/Dockerfile 머리 주석). 테스트는
      # PR 의 ci.yml 이 이미 돌렸으므로 여기서 다시 돌리지 않습니다.
      - name: bootJar → docker build → push
        if: ${{ steps.exists.outputs.exists != 'true' }}
        env:
          IMAGE: ${{ needs.guard.outputs.api_image }}
        run: |
          set -euo pipefail
          (cd apps/api && ./gradlew --no-daemon --console=plain bootJar)
          docker build -t "$IMAGE" apps/api
          docker push "$IMAGE"

  build_web:
    name: 이미지 · web (GHCR)
    needs: guard
    if: ${{ needs.guard.outputs.environment == 'dev' }}
    # 웹 설정(사이트 URL·Sentry·Amplitude)은 이 환경의 variables 에서 옵니다 — fe 잡과 같은 이름입니다.
    # environment를 지정하면 GitHub가 Deployment 이벤트를 남기고, GitHub for Jira
    # 앱이 이를 Jira로 넘겨 이슈 화면에 배포 이력이 붙습니다.
    environment: ${{ needs.guard.outputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # GHCR push. 로그인은 GITHUB_TOKEN 입니다.
    steps:
      - uses: actions/checkout@v7

      # fe 잡과 같은 게이트입니다(deploy/consent-gate.sh) — 계측 키가 방침 고지보다 앞서면 멈춥니다.
      - name: 계측 키가 방침 고지보다 앞서지 않는지
        env:
          AMPLITUDE_KEY: ${{ vars.AMPLITUDE_API_KEY_WEB }}
        run: deploy/consent-gate.sh

      - name: GHCR 로그인
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # deploy/ghcr-image-exists.sh — 0 있다 · 1 없다 · 2 판정 불가(레지스트리 오류는 다시 굽지 않고 실패).
      - name: 같은 sha 이미지가 이미 있는지
        id: exists
        env:
          IMAGE: ${{ needs.guard.outputs.web_image }}
          REBUILD: ${{ inputs.rebuild_images }}
        run: |
          set -euo pipefail
          if [ "$REBUILD" = "true" ]; then
            echo "rebuild_images — 있어도 다시 굽습니다: $IMAGE"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif deploy/ghcr-image-exists.sh "$IMAGE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?; [ "$rc" = 1 ] || exit "$rc"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 빌드는 Docker 안에서 돕니다(apps/web/Dockerfile: pnpm install → prebuild → next build) — 러너에
      # node 가 필요 없습니다. build-arg 는 브라우저에 내려가는 공개값뿐이고 SENTRY_AUTH_TOKEN 만
      # --secret 마운트로 들어가 레이어에 남지 않습니다.
      #
      # API_ORIGIN 은 vars.API_ORIGIN(EC2 의 127.0.0.1:8080)이 아니라 compose 서비스 이름 http://api:8080
      # 입니다 — 홈서버에서 웹의 rewrites 는 같은 네트워크의 api 컨테이너로 갑니다. 사이트 URL 은
      # dev.acttub.com 그대로입니다. 임시 호스트명(dev-home)은 터널 스모크용이라 번들에 새기지 않습니다.
      - name: docker build → push
        if: ${{ steps.exists.outputs.exists != 'true' }}
        env:
          IMAGE: ${{ needs.guard.outputs.web_image }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # DSN이 비어 있으면 계측이 꺼진 번들이 나가는데, 빌드는 통과하므로 배포가 초록이어도
          # 에러가 안 올라옵니다. 릴리스(commit)는 소스맵 업로드와 런타임이 같은 값을 봐야 합니다.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
          NEXT_PUBLIC_SENTRY_ENV: ${{ needs.guard.outputs.environment }}
          # 키가 비면 계측이 꺼진 번들이 나갑니다. dev와 운영에 서로 다른 프로젝트 키를 넣어
          # 통계를 나눕니다. 개인정보처리방침에 Amplitude 위탁이 발행되기 전에는 비워 둡니다(위 게이트).
          NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY_WEB }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WEB }}
          # secret 이 없으면 빈 값이 들어가고 Dockerfile 이 소스맵 업로드를 건너뜁니다(실측: --secret 의
          # env= 는 변수가 비어 있거나 없어도 빌드가 통과합니다). 지금 이 secret 은 어느 환경에도 없습니다.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          docker build -f apps/web/Dockerfile \
            --build-arg API_ORIGIN=http://api:8080 \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="$NEXT_PUBLIC_SENTRY_DSN" \
            --build-arg NEXT_PUBLIC_SENTRY_ENV="$NEXT_PUBLIC_SENTRY_ENV" \
            --build-arg NEXT_PUBLIC_AMPLITUDE_API_KEY="$NEXT_PUBLIC_AMPLITUDE_API_KEY" \
            --build-arg NEXT_PUBLIC_APP_COMMIT="$GITHUB_SHA" \
            --build-arg SENTRY_ORG="$SENTRY_ORG" \
            --build-arg SENTRY_PROJECT="$SENTRY_PROJECT" \
            --secret id=SENTRY_AUTH_TOKEN,env=SENTRY_AUTH_TOKEN \
            -t "$IMAGE" .
          docker push "$IMAGE"

  # 러너가 Tailscale 임시 노드(tag:ci)가 되어 홈서버의 deploy 계정에 Tailscale SSH 로 들어갑니다.
  # 열쇠는 OAuth 클라이언트 하나뿐입니다 — 서버 IP 도 SSH 개인키도 secrets 에 없고, 접근 범위는
  # Tailscale ACL 이 정합니다(tag:ci → tag:homeserver, users [deploy]; deploy/home/prepare-server.sh
  # 3단계). 노드는 ephemeral 이라 잡이 끝나면(action 의 post 단계가 logout) 태일넷에서 사라집니다.
  #
  # 서버의 프로젝트 디렉토리(/svc/acttub/<env>)에는 사람이 채운 .env 가 있고, compose.yml 과 deploy.sh 는
  # 이 잡이 매번 보냅니다(레포가 정본). .env 는 건드리지 않습니다.
  #
  # 서버가 꺼져 있거나 닿지 않으면 SSH 가 실패해 이 잡이 빨강이고 notify 가 Slack 으로 보냅니다.
  # 재실행하면 이미지는 이미 있어 빌드를 건너뛰고 여기부터 다시 합니다.
  deploy_home:
    name: 홈서버 배포 (compose)
    needs: [guard, build_api, build_web]
    if: ${{ needs.guard.outputs.environment == 'dev' }}
    environment: ${{ needs.guard.outputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tailscale MagicDNS 이름입니다. IP 는 태일넷이 알고 있어 여기 적지 않습니다.
      SERVER: insung-server
      REMOTE_DIR: /svc/acttub/${{ needs.guard.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      # 서버는 로그인 없이 pull 합니다(deploy.sh). 이 잡은 GHCR 에 로그인하지 않으므로 여기서 같은 방식으로
      # 먼저 봅니다 — private 이면 서버의 pull 에서 빨강이 되는 대신 여기서 이유와 함께 멈춥니다. 첫 push 로
      # 생긴 패키지의 가시성은 GitHub 이 정합니다(public 레포의 GITHUB_TOKEN 이면 public 을 상속). private 이면
      # 사람이 패키지 설정에서 public 으로 바꿉니다 — 이미지에는 공개값만 들어 있습니다(build_* 주석).
      - name: 이미지 둘이 로그인 없이 당겨지는지 (GHCR 공개)
        env:
          API_IMAGE: ${{ needs.guard.outputs.api_image }}
          WEB_IMAGE: ${{ needs.guard.outputs.web_image }}
        run: |
          set -euo pipefail
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            if ! deploy/ghcr-image-exists.sh "$image"; then
              echo "::error::$image 를 로그인 없이 당길 수 없습니다 — 패키지 가시성을 public 으로 바꿉니다: https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages"
              exit 1
            fi
          done

      - name: Tailscale 임시 노드
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # up 이 끝난 뒤 서버에 tailscale ping 을 보내 연결과 MagicDNS 를 먼저 확인합니다.
          ping: ${{ env.SERVER }}

      # Tailscale SSH 는 호스트키를 태일넷 신원으로 보증하므로 첫 접속의 키를 그대로 받습니다(accept-new).
      # 러너에는 프롬프트에 답할 사람이 없으니 BatchMode 로 어떤 물음도 띄우지 않게 합니다.
      - name: SSH 설정
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host $SERVER
            User deploy
            BatchMode yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          EOF
          # 원격 명령의 $REMOTE_DIR 는 러너에서 채워 보냅니다(의도) — 아래 두 스텝도 같습니다.
          # shellcheck disable=SC2029
          ssh "$SERVER" "hostname && docker compose version && test -f '$REMOTE_DIR/.env'"

      # tar 파이프 — deploy.sh 의 실행 비트가 그대로 가고 SFTP 서브시스템이 필요 없습니다. 두 파일만
      # 보내므로 같은 디렉토리의 .env·release.env 는 그대로입니다.
      - name: compose.yml·deploy.sh 전송
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029
          tar -C deploy/home -cf - compose.yml deploy.sh | ssh "$SERVER" "tar -C '$REMOTE_DIR' -xf -"

      # release.env 쓰기 → pull → up --wait(healthy, 최대 180초) → web 경유 /health 의 commit 대조.
      # 어느 단계든 실패하면 exit≠0 이라 이 스텝이 빨강입니다. 같은 sha 면 compose 가 아무것도 바꾸지
      # 않습니다. 롤백은 이전 sha 로 이 워크플로를 다시 실행하는 것입니다.
      - name: deploy.sh
        env:
          API_IMAGE: ${{ needs.guard.outputs.api_image }}
          WEB_IMAGE: ${{ needs.guard.outputs.web_image }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029
          ssh "$SERVER" "cd '$REMOTE_DIR' && ./deploy.sh '$GITHUB_SHA' '$API_IMAGE' '$WEB_IMAGE'"

      # 터널을 거쳐 밖에서 봅니다. cloudflared 는 같은 compose 의 edge 프로필에 있고 deploy.sh 의 --wait 가
      # 그 healthy(엣지 연결)까지 기다렸으므로 보통 첫 시도에 맞습니다. 재시도는 DNS·엣지 전파 몫입니다.
      # HOME_PUBLIC_URL 은 이 환경의 variable 입니다 — 지금은 임시 호스트명(dev-home.acttub.com), dev.acttub.com
      # 을 터널로 교체할 때(SOMA-489 06) 값만 바꿉니다. 변수가 없으면 경고만 남기고 건너뜁니다(같은 대조를
      # deploy.sh 가 컨테이너 안에서 이미 했습니다) — 조용히 빠지지 않도록 잡 로그에 warning 으로 찍힙니다.
      - name: 공개 URL 의 /health.commit 대조
        env:
          PUBLIC_URL: ${{ vars.HOME_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_URL" ]; then
            echo "::warning::dev 환경에 HOME_PUBLIC_URL 변수가 없습니다 — 터널 경유 /health 확인을 건너뜁니다(컨테이너 안 대조는 deploy.sh 가 했습니다)."
            exit 0
          fi
          expected="${GITHUB_SHA:0:7}"
          body=""
          for i in $(seq 1 12); do
            # -f 를 쓰지 않습니다 — 상태 코드와 본문 앞부분을 그대로 찍어야 DNS 미해석·Cloudflare 오류 페이지·
            # 옛 컨테이너 응답을 로그에서 구분할 수 있습니다(첫 실행에서 "없음" 만 남아 원인을 못 봤습니다).
            if out="$(curl -sS --max-time 10 -w '\n%{http_code}' "$PUBLIC_URL/health" 2>&1)"; then
              code="${out##*$'\n'}"; body="${out%$'\n'*}"
            else
              # curl 자체가 실패하면(DNS 미해석·연결 거부) 상태는 000 이고 이유는 stderr 줄에 있습니다 — 그것을 남깁니다.
              code="curl:${out##*$'\n'}"; body="${out%$'\n'*}"
            fi
            got="$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$code" = "200" ] && [ "$got" = "$expected" ]; then
              echo "✔ $PUBLIC_URL/health → commit $got"
              exit 0
            fi
            echo "  ($i/12) $code commit '${got:-없음}' ≠ $expected — 10초 뒤 재시도: ${body:0:160}"
            sleep 10
          done
          echo "::error::$PUBLIC_URL/health 의 commit 이 $expected 가 아닙니다 (마지막: $code ${body:0:300})"
          exit 1

  # ── prod — AWS 길(S3 + SSM). PR ② 까지 그대로입니다 ──────────────────────────────────
  #
  # 백엔드 배포입니다. 2026-08-17 운영 컷오버(SOMA-394)까지 끝나 프록시 대상이 8080 이므로,
  # 이 잡이 곧 트래픽을 받는 프로세스를 갱신합니다.
  #
  # inputs.target은 push 이벤트에서 비어 있습니다. push는 곧 전체 배포이므로
  # 기본값 both를 씁니다. 환경은 guard가 판정한 값 하나만 봅니다.
  #
  # **파이썬은 배포에 실리지 않습니다.** 스키마 정본이 Flyway 로 넘어가(SOMA-403 3단계)
  # 마이그레이션이 jar 기동의 일부가 됐습니다 — 별도 migrate 스텝이 없습니다.
  #
  # 그래서 "코드는 새것·DB는 구것" 인 창이 구조적으로 사라집니다. 마이그레이션이 실패하면
  # 앱이 아예 리슨을 시작하지 못하고, 아래 `Install on instance` 의 health·NRestarts 검사가
  # 그것을 배포 실패로 보고합니다. alembic 시절에는 마이그레이션이 별도 스텝이라 부분
  # 적용이 성공으로 읽힐 수 있었고(2026-08-01 커뮤니티 500), `check-migration.sh` 가 그
  # 창을 사후에 대조했습니다.
  #
  # ⚠ **되돌리기 어려운 것은 그대로입니다.** 스키마를 먼저 넓히고 코드를 나중에 좁히는
  # 순서로 통제합니다(docs/deploy/DEPLOY-VPC.md 6-4).
  be_java:
    name: back svc (Spring Boot)
    needs: guard
    environment: ${{ needs.guard.outputs.environment }}
    if: ${{ needs.guard.outputs.environment == 'prod' && ((inputs.target || 'both') == 'both' || inputs.target == 'be-java') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package & upload (jar)
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: deploy/upload-api-java.sh

      # jar 하나가 아티팩트의 전부입니다. 마이그레이션은 이 스텝 안에서, 앱이 뜨는
      # 도중에 Flyway 가 돌립니다.
      - name: Install on instance
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          # 빠뜨리면 ssm-deploy.sh 의 drop-in 이 둘 다 unknown 으로 박습니다 —
          # Sentry 에서 어느 커밋인지 알 수 없고(SENTRY_RELEASE), /health 의 commit 도
          # unknown 으로 남아 배포된 프로세스를 밖에서 확인할 수 없습니다(SOMA-401).
          RELEASE: ${{ github.sha }}
        run: deploy/ssm-deploy.sh be-java ${{ vars.BE_INSTANCE_ID }}

  # 스키마는 있는데 flyway_schema_history 가 없는 DB 마다 최초 1회. 운영이 그렇습니다
  # (alembic 이 스키마를 만들었습니다). 마이그레이션은 실행하지 않고 기록만 남깁니다.
  #
  # 빈 DB 에서 시작하는 신규 환경·재해복구에는 필요 없습니다 — 거기서는 Flyway 가 V1 부터
  # 그대로 적용합니다(docs/archive/soma287/M6-findings.md §3).
  be_java_baseline:
    name: back svc (Spring Boot) Flyway baseline
    needs: guard
    environment: ${{ needs.guard.outputs.environment }}
    if: ${{ needs.guard.outputs.environment == 'prod' && inputs.target == 'be-java-baseline' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Baseline on instance
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: deploy/ssm-deploy.sh be-java-baseline ${{ vars.BE_INSTANCE_ID }}

  fe:
    name: front svc (Next 서버)
    needs: guard
    # environment를 지정하면 GitHub가 Deployment 이벤트를 남기고, GitHub for Jira
    # 앱이 이를 Jira로 넘겨 이슈 화면에 배포 이력이 붙습니다.
    environment: ${{ needs.guard.outputs.environment }}
    if: ${{ needs.guard.outputs.environment == 'prod' && ((inputs.target || 'both') == 'both' || inputs.target == 'fe') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 계측 키가 방침 고지보다 먼저 들어가는 것을 막습니다(deploy/consent-gate.sh — build_web 과 같은 게이트).
      - name: 계측 키가 방침 고지보다 앞서지 않는지
        env:
          AMPLITUDE_KEY: ${{ vars.AMPLITUDE_API_KEY_WEB }}
        run: deploy/consent-gate.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 빌드 → sharp 제외 → 정적 자산 병합 → *.node 잔존 검사 → S3 업로드.
      # API_ORIGIN은 빌드 시점에 routes-manifest로 굳으므로 여기서 주어야 합니다.
      - name: Build & upload
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # Sentry도 빌드 시점에 굳습니다. DSN이 비어 있으면 계측이 꺼진 번들이
          # 나가는데, 빌드는 통과하므로 배포가 초록이어도 에러가 안 올라옵니다.
          # 릴리스는 소스맵 업로드와 런타임이 같은 값을 봐야 스택트레이스가 풀립니다.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
          NEXT_PUBLIC_SENTRY_ENV: ${{ needs.guard.outputs.environment }}
          NEXT_PUBLIC_APP_COMMIT: ${{ github.sha }}
          # Amplitude도 빌드 시점에 굳습니다. 키가 비면 계측이 꺼진 번들이 나갑니다.
          # dev와 운영에 서로 다른 프로젝트 키를 넣어 통계를 나눕니다 — 호스트로
          # 거르지 않으므로 같은 키를 두 환경에 주면 데이터가 한 프로젝트에 섞입니다.
          # ⚠️ 개인정보처리방침에 Amplitude 위탁이 발행되기 전에는 비워 둡니다.
          NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY_WEB }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WEB }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: deploy/upload-web.sh

      - name: Install on instance
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: deploy/ssm-deploy.sh fe ${{ vars.FE_INSTANCE_ID }}

  # 배포 결과를 Slack #배포알림 으로 보냅니다. dev는 실패만, 운영은 성공도 알립니다.
  # dev는 머지마다 돌아 월 60회가 넘으므로, 성공까지 보내면 두 주 만에 아무도 보지
  # 않게 되고 정작 실패가 묻힙니다. 홈서버 dev 의 이미지 빌드·배포 실패도 같은 알림입니다.
  notify:
    name: 결과 통지
    needs: [guard, fe, be_java, be_java_baseline, build_api, build_web, deploy_home]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 통지가 실패해도 배포 결과를 덮지 않게 합니다 — Slack이 죽어도 배포는 초록입니다.
    continue-on-error: true
    steps:
      - name: Slack 통지
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          # guard가 실패하면 output이 비므로 표시용 기본값을 둡니다.
          ENVIRONMENT: ${{ needs.guard.outputs.environment || 'dev' }}
          GUARD: ${{ needs.guard.result }}
          FE: ${{ needs.fe.result }}
          BE_JAVA: ${{ needs.be_java.result }}
          BE_JAVA_BASELINE: ${{ needs.be_java_baseline.result }}
          BUILD_API: ${{ needs.build_api.result }}
          BUILD_WEB: ${{ needs.build_web.result }}
          DEPLOY_HOME: ${{ needs.deploy_home.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # 시크릿이 없는 포크·초기 상태에서도 워크플로가 깨지지 않게 조용히 넘어갑니다.
          if [ -z "${WEBHOOK}" ]; then
            echo "SLACK_WEBHOOK_DEPLOY 미설정 — 통지를 건너뜁니다."
            exit 0
          fi

          # skipped 는 실패가 아닙니다. 환경에 따라 한쪽 길의 잡은 전부 skipped 이고(dev 면 fe·be_java,
          # prod 면 이미지·홈서버), target=fe 배포에서는 be_java 가, guard 가 막으면 전부 skipped 로 남습니다.
          failed=""
          cancelled=""
          for pair in "$GUARD:사전점검" "$FE:front" "$BE_JAVA:back(java)" "$BE_JAVA_BASELINE:back(java baseline)" \
                      "$BUILD_API:이미지(api)" "$BUILD_WEB:이미지(web)" "$DEPLOY_HOME:홈서버"; do
            result="${pair%%:*}"
            label="${pair#*:}"
            case "$result" in
              failure) failed="${failed} ${label}" ;;
              cancelled) cancelled=1 ;;
            esac
          done
          if [ -n "$cancelled" ]; then failed="${failed} (일부 취소됨)"; fi

          if [ -n "$failed" ]; then
            color="danger"
            head=":rotating_light: *${ENVIRONMENT} 배포 실패* —${failed}"
          elif [ "$FE" = "skipped" ] && [ "$BE_JAVA" != "skipped" ]; then
            # 운영에서 백엔드만 올린 실행입니다. 프록시 대상이 8080 이라 이것만으로 트래픽을
            # 받는 프로세스가 갈립니다 — 화면은 그대로라는 뜻입니다.
            color="good"
            head=":package: *${ENVIRONMENT} 백엔드(자바)만 갱신* (화면 변경 없음)"
          elif [ "$ENVIRONMENT" = "prod" ]; then
            color="good"
            head=":white_check_mark: *운영 배포 완료*"
          else
            echo "dev 배포 성공 — 통지하지 않습니다."
            exit 0
          fi

          text="${head}"$'\n'"<${RUN_URL}|실행 로그> · \`${GITHUB_SHA:0:7}\` · ${GITHUB_ACTOR}"

          # 브랜치명·커밋에 따옴표가 섞여도 깨지지 않도록 payload 는 jq 로 만듭니다.
          jq -n --arg t "$text" --arg c "$color" \
            '{attachments:[{color:$c, text:$t, mrkdwn_in:["text"]}]}' \
            | curl -sS -X POST -H 'Content-type: application/json' --data @- "$WEBHOOK"
