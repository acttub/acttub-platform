# Gradle 의존성은 lockfile 이 없어 GitHub 가 저장소만 읽어서는 전체 목록(전이 의존성 포함)을 알 수 없습니다.
# 빌드로 해석한 목록을 의존성 그래프에 제출해 Dependabot 이 api 의 취약한 의존성도 알리게 합니다.
# Android 모듈은 android/ 폴더가 빌드 때 생겨(저장소에 없음) 제출 대상에서 뺐습니다.
name: Gradle dependency submission

on:
  push:
    branches: [dev]
    paths:
      - apps/api/build.gradle.kts
      - apps/api/settings.gradle.kts
      - apps/api/gradle/**
      - .github/workflows/gradle-dependency-submission.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    name: api 의존성 제출
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: apps/api
