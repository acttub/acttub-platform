# PR 게이트 CI — dev·main으로 향하는 PR에서 웹·API·모바일을 검증합니다.
# 이 잡들을 ruleset 의 required status check 로 넣어야 초록불이어야만 머지가 됩니다.
# ⚠ ruleset 은 하나가 아닙니다 — "Require merge commits for main (release)"(main)과
# "Require pull requests for dev"(dev)가 같은 목록을 따로 들고 있어 둘 다 고쳐야 합니다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch: # Actions 탭에서 수동 실행

# 같은 PR에 새 커밋이 올라오면 진행 중이던 오래된 실행은 취소.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm을 먼저 깔아야 setup-node의 cache:pnpm이 동작합니다.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # pnpm-workspace.yaml가 apps/mobile(Expo)을 제외하므로 웹만 설치됩니다.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 빌드 모드는 하나뿐이고(standalone), 이것이 실제 배포 산출물입니다
      # (deploy.yml → upload-web.sh가 같은 명령을 씁니다).
      # Build를 typecheck보다 먼저 돌려야 합니다: next build가 next-env.d.ts와
      # .next/types(typedRoutes)를 생성해야 tsc가 *.png import·라우트 타입을 해석합니다.
      # 이 산출물들은 gitignore라 클린 체크아웃엔 없습니다.
      # API_ORIGIN은 빌드 시점에 굳지만, 여기서는 컴파일 여부만 보므로 기본값을 씁니다.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter web test

  # 백엔드의 유일한 관문입니다. 계약 하네스 잡 둘(`contract-harness`·
  # `contract-harness-java`)이 SOMA-403 4단계에서 사라졌고, 그것들이 보던 계약은
  # Java 테스트로 옮겨져 이 잡 안에서 돕니다(docs/archive/soma287/M6-contract-migration.md).
  #
  # ⚠ 잡 이름을 `api-java (…)` 에서 바꿨습니다(SOMA-403 5단계, 파이썬 잡이 사라지면서).
  # **잡 이름이 곧 required status check 의 context 라 ruleset 도 함께 갱신해야 합니다** —
  # 옛 이름을 required 로 남겨 두면 영원히 오지 않는 관문이 됩니다.
  api:
    name: api (gradle test · Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers가 postgres:18-alpine을 띄웁니다(운영 RDS와 같은 메이저).
      # 러너에 Docker가 기본 탑재돼 있고, DOCKER_API_VERSION은 build.gradle.kts가 채웁니다.
      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: apps/api/build/reports/tests/test

  # 모바일은 pnpm 워크스페이스 밖이라(pnpm-workspace.yaml 의 !apps/mobile) 위 web
  # 잡이 설치조차 하지 않습니다. 이 잡이 생기기 전에는 apps/mobile 만 고친 PR 이
  # 아무것도 돌지 않은 채 초록이었습니다.
  #
  # 설치 단계가 없는 것은 실수가 아닙니다 — 스위트가 import 하는 것은 node: 빌트인과
  # 프로젝트 .ts 파일뿐이고 @/ 로 들어오는 둘은 import type 이라 타입 스트리핑에
  # 지워집니다. node_modules 를 통째로 치운 채 전부 통과하는 것을 확인했습니다.
  # 여기에 런타임 의존이 하나라도 생기면 npm ci 가 필요해집니다.
  #
  # ⚠ expo lint·tsc 는 일부러 뺐습니다. expo lint 는 Expo 전체 트리 설치가 필요해
  # 20초짜리 잡을 몇 분으로 늘리고, tsc 는 typedRoutes 타입(.expo/types, gitignore)이
  # 클린 체크아웃에 없어 실재하는 라우트를 전부 오류로 냅니다.
  mobile:
    name: mobile (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # .ts 를 그대로 import 합니다(Node 타입 스트리핑). 웹과 달리 커스텀 로더가 없습니다.
      - name: Test
        run: node --test tests/*.test.mjs
