# PR 게이트 CI — dev·main으로 향하는 PR에서 웹·API를 검증합니다.
# ruleset "Require pull requests for main and dev"에 이 잡들을 required status check로
# 추가하면, 초록불이어야만 머지가 됩니다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch: # Actions 탭에서 수동 실행

# 같은 PR에 새 커밋이 올라오면 진행 중이던 오래된 실행은 취소.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm을 먼저 깔아야 setup-node의 cache:pnpm이 동작합니다.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # pnpm-workspace.yaml가 apps/mobile(Expo)을 제외하므로 웹만 설치됩니다.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 빌드 모드는 하나뿐이고(standalone), 이것이 실제 배포 산출물입니다
      # (deploy.yml → upload-web.sh가 같은 명령을 씁니다).
      # Build를 typecheck보다 먼저 돌려야 합니다: next build가 next-env.d.ts와
      # .next/types(typedRoutes)를 생성해야 tsc가 *.png import·라우트 타입을 해석합니다.
      # 이 산출물들은 gitignore라 클린 체크아웃엔 없습니다.
      # API_ORIGIN은 빌드 시점에 굳지만, 여기서는 컴파일 여부만 보므로 기본값을 씁니다.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter web test

  api:
    name: api (pytest · DB 통합)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # config가 .env 없이도 뜨도록 더미 값을 주입. 일반 테스트는 fake session이라
    # 실접속하지 않고, DB 통합 테스트만 아래 Postgres 서비스에 붙습니다.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-test-secret-not-a-real-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # setup-uv는 v8부터 메이저 별칭 태그(vN)를 두지 않습니다 — 정확한 버전으로 고정합니다.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      # 워크스페이스 전체(acting-api가 acting-agent/report/summary를 import) + dev 그룹(pytest).
      - name: Sync deps
        run: uv sync --frozen --all-packages

      # AGENTS.md 기본 테스트 명령. RUN_DB_TESTS 없으면 test_db_store.py는 skip.
      - name: Test (fake store)
        run: uv run --package acting-api pytest

      # #29 500 장애가 새어나간 갭. 실제 Postgres에 스키마를 만들고 마이그레이션을 돌려 검증.
      - name: Test (PostgreSQL 통합)
        env:
          RUN_DB_TESTS: "1"
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run --package acting-api pytest acting-api/tests/test_db_store.py

  # SOMA-287(Spring Boot 이관)의 이관 대상. 이 잡이 없던 동안 Java 통합 테스트 17개가
  # 깨진 채로 dev가 초록이었습니다 — 이관이 끝날 때까지 여기가 유일한 관문입니다.
  api-java:
    name: api-java (gradle test · Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-java
    env:
      # FlywayBaselineTest가 alembic을 못 돌리면 건너뛰지 말고 실패하게 합니다.
      # 건너뛰기를 허용하면 "둘 다 낡아도 초록"인 자기참조 상태로 되돌아갑니다.
      REQUIRE_ALEMBIC_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # FlywayBaselineTest가 apps/api의 alembic을 실제로 돌려 스키마를 대조합니다.
      # 그래서 Java 잡인데도 파이썬 워크스페이스가 필요합니다.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync python deps (alembic 대조용)
        working-directory: apps/api
        run: uv sync --frozen --all-packages

      # SPEC이 가리키는 심볼이 소스에 실재하는지 봅니다(/SPEC.md §12).
      # 라인 번호 참조가 dev 전진마다 조용히 낡던 문제를 막습니다.
      - name: SPEC 참조 드리프트 검사
        working-directory: ${{ github.workspace }}
        run: python3 spec/check-refs.py

      # Testcontainers가 postgres:18-alpine을 띄웁니다(운영 RDS와 같은 메이저).
      # 러너에 Docker가 기본 탑재돼 있고, DOCKER_API_VERSION은 build.gradle.kts가 채웁니다.
      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-java-test-report
          path: apps/api-java/build/reports/tests/test
