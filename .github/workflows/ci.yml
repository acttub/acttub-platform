# PR 게이트 CI — dev·main으로 향하는 PR에서 웹·API를 검증합니다.
# ruleset "Require pull requests for main and dev"에 이 잡들을 required status check로
# 추가하면, 초록불이어야만 머지가 됩니다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch: # Actions 탭에서 수동 실행

# 같은 PR에 새 커밋이 올라오면 진행 중이던 오래된 실행은 취소.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm을 먼저 깔아야 setup-node의 cache:pnpm이 동작합니다.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # pnpm-workspace.yaml가 apps/mobile(Expo)을 제외하므로 웹만 설치됩니다.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 빌드 모드는 하나뿐이고(standalone), 이것이 실제 배포 산출물입니다
      # (deploy.yml → upload-web.sh가 같은 명령을 씁니다).
      # Build를 typecheck보다 먼저 돌려야 합니다: next build가 next-env.d.ts와
      # .next/types(typedRoutes)를 생성해야 tsc가 *.png import·라우트 타입을 해석합니다.
      # 이 산출물들은 gitignore라 클린 체크아웃엔 없습니다.
      # API_ORIGIN은 빌드 시점에 굳지만, 여기서는 컴파일 여부만 보므로 기본값을 씁니다.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter web test

  api:
    name: api (pytest · DB 통합)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # config가 .env 없이도 뜨도록 더미 값을 주입. 일반 테스트는 fake session이라
    # 실접속하지 않고, DB 통합 테스트만 아래 Postgres 서비스에 붙습니다.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-test-secret-not-a-real-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # setup-uv는 v8부터 메이저 별칭 태그(vN)를 두지 않습니다 — 정확한 버전으로 고정합니다.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      # 워크스페이스 전체(acting-api가 acting-agent/report/summary를 import) + dev 그룹(pytest).
      - name: Sync deps
        run: uv sync --frozen --all-packages

      # AGENTS.md 기본 테스트 명령. RUN_DB_TESTS 없으면 test_db_store.py는 skip.
      - name: Test (fake store)
        run: uv run --package acting-api pytest

      # #29 500 장애가 새어나간 갭. 실제 Postgres에 스키마를 만들고 마이그레이션을 돌려 검증.
      - name: Test (PostgreSQL 통합)
        env:
          RUN_DB_TESTS: "1"
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run --package acting-api pytest acting-api/tests/test_db_store.py

  # M1 계약 동등성 하네스(tools/contract-harness). M2 이후 모든 사이클의 완료 판정이
  # 여기에 의존하므로, 하네스 자신이 깨지면 이관 전체의 판정 근거가 사라집니다.
  contract-harness:
    name: contract-harness (self-test · diff 0)
    runs-on: ubuntu-latest
    env:
      HARNESS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONPATH: ${{ github.workspace }}/tools/contract-harness
    services:
      postgres:
        # 운영 RDS와 같은 메이저(/SPEC.md §2). alembic이 여기에 스키마 두 벌을 만듭니다.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync deps
        working-directory: apps/api
        run: uv sync --frozen --all-packages

      # 리포터·정규화·inventory 단위 테스트. DB가 필요 없습니다.
      - name: 단위 테스트
        working-directory: tools/contract-harness
        run: ../../apps/api/.venv/bin/python -m pytest tests -q

      # AST inventory의 모든 항목이 manifest에 연결되거나 명시적 제외 사유를 갖는지.
      - name: 오류 계약 manifest 연결 검사
        working-directory: tools/contract-harness
        run: ../../apps/api/.venv/bin/python -m contract_harness --check-manifest

      # 같은 FastAPI 앱을 두 독립 스키마에 대해 돌려 전 시나리오 diff 0 + 41개 operation 커버리지.
      - name: 자기 동일성 (diff 0)
        working-directory: tools/contract-harness
        run: ../../apps/api/.venv/bin/python -m contract_harness --baseline fastapi --target fastapi

      # 의도적으로 변조한 백엔드를 지정된 계층이 잡는지.
      - name: 변조 감지 self-test
        working-directory: tools/contract-harness
        run: ../../apps/api/.venv/bin/python -m contract_harness --self-test

  # 위 잡이 "하네스 자신이 건강한가"를 본다면, 여기는 **Java가 FastAPI 계약을 재현하는가**를
  # 봅니다. 목적이 달라 한 잡에 합치지 않습니다 — 실패 원인이 섞이면 판독이 어렵습니다.
  #
  # 이 잡이 없던 동안 `--target java`는 사람이 로컬에서 돌릴 때만 검사됐습니다. 패키지
  # 재편(SOMA-397)은 row → Domain Model → DTO로 매핑을 한 단계 늘리는데, 웹은 FastAPI
  # 스펙으로 타입을 생성하므로 필드 하나가 새도 컴파일 타임에 안 잡힙니다. 그래서 재편의
  # 선행 조건이 이 관문입니다(SOMA-397 3단계).
  contract-harness-java:
    name: contract-harness-java (java 계약 diff 0)
    runs-on: ubuntu-latest
    env:
      HARNESS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # 앱이 읽는 이름은 이쪽입니다. 하네스가 만든 스키마와 같은 DB를 봐야 합니다.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONPATH: ${{ github.workspace }}/tools/contract-harness
      HARNESS_SCHEMA: harness_target
      # 값의 정본은 하네스 config.py입니다(README의 `java 타겟` 절 표). JWT_SECRET이
      # 어긋나면 전량 401, GEMINI_MODEL이 어긋나면 /health의 $.model이 diff입니다.
      JWT_SECRET: contract-harness-jwt-secret
      GEMINI_MODEL: harness-summary-model
      # 기본값은 apps/api-java 기준 상대경로라, 다른 곳에서 띄우면 절대경로가 필요합니다.
      HARNESS_AUTH_PROVIDER_FIXTURE: ${{ github.workspace }}/tools/contract-harness/contract_harness/fixtures/auth_providers.json
      HARNESS_S3_FIXTURE: ${{ github.workspace }}/tools/contract-harness/contract_harness/fixtures/s3.json
      HARNESS_LLM_FIXTURE: ${{ github.workspace }}/tools/contract-harness/contract_harness/fixtures/llm.json
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # api-java 잡과 병렬로 도므로 캐시는 읽기만 합니다. 양쪽이 같은 키로 저장하려 들면
      # 경합 경고가 납니다 — 캐시를 채우는 쪽은 api-java 하나로 둡니다.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      # 하네스는 apps/api의 uv 가상환경을 그대로 씁니다(새 의존성을 들이지 않습니다).
      # baseline(fastapi)이 in-process로 뜨므로 워크스페이스 전체가 필요합니다.
      - name: Sync deps
        working-directory: apps/api
        run: uv sync --frozen --all-packages

      # ⚠ bootJar가 실패해도 java는 옛 jar로 조용히 뜹니다. 별도 스텝으로 떼어 두면
      # 실패가 여기서 멈춥니다.
      - name: bootJar
        working-directory: apps/api-java
        run: ./gradlew bootJar

      # 인스턴스보다 **먼저** 돌아야 합니다. contract 프로파일은 flyway를 끄고
      # ddl-auto: validate로 뜨므로, 스키마가 없으면 셋 다 검증 실패로 죽습니다.
      - name: 스키마 준비 (alembic head 2벌)
        working-directory: tools/contract-harness
        run: ../../apps/api/.venv/bin/python -m contract_harness --prepare-schemas

      # 기본(ADMIN_OPS_TOKEN 없음) · admin(토큰 있음) · nostorage. Spring profile과
      # 환경변수가 기동 시 고정되므로 한 인스턴스로는 전량을 못 돕니다.
      # ⚠ -Dacttub.dotenv.enabled=false가 판정의 전제입니다. 하네스가 주지 않는 키가
      #    새어들면 판정이 실행 환경에 좌우됩니다.
      - name: 인스턴스 셋 기동
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/apps/api-java/build/libs/acting-api.jar"
          mkdir -p "$RUNNER_TEMP/harness-logs"

          java -Dacttub.dotenv.enabled=false -jar "$JAR" \
            --spring.profiles.active=contract --server.port=8099 \
            > "$RUNNER_TEMP/harness-logs/8099.log" 2>&1 &
          ADMIN_OPS_TOKEN=contract-harness-admin-token \
          java -Dacttub.dotenv.enabled=false -jar "$JAR" \
            --spring.profiles.active=contract --server.port=8100 \
            > "$RUNNER_TEMP/harness-logs/8100.log" 2>&1 &
          java -Dacttub.dotenv.enabled=false -jar "$JAR" \
            --spring.profiles.active=contract,nostorage --server.port=8101 \
            > "$RUNNER_TEMP/harness-logs/8101.log" 2>&1 &

          for port in 8099 8100 8101; do
            for i in $(seq 1 120); do
              if curl -sf "http://127.0.0.1:$port/health" > /dev/null 2>&1; then
                echo ":$port up (${i}s)"
                break
              fi
              if [ "$i" -eq 120 ]; then
                echo ":$port 기동 실패 — 로그 꼬리:"
                tail -40 "$RUNNER_TEMP/harness-logs/$port.log"
                exit 1
              fi
              sleep 1
            done
          done

      # 27시나리오 전량. 실패하면 계약이 어긋난 것이며 재시도하지 않습니다 —
      # 재시도를 깔면 남은 비결정성을 덮어 관문의 의미가 사라집니다.
      - name: java diff 0
        working-directory: tools/contract-harness
        run: |
          ../../apps/api/.venv/bin/python -m contract_harness \
            --baseline fastapi --target java \
            --java-base-url http://127.0.0.1:8099 \
            --java-admin-base-url http://127.0.0.1:8100 \
            --java-nostorage-base-url http://127.0.0.1:8101

      # diff만 보고는 원인을 못 좁힙니다. 앱 로그가 유일한 단서입니다.
      - name: Upload instance logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-harness-java-logs
          path: ${{ runner.temp }}/harness-logs

  # SOMA-287(Spring Boot 이관)의 이관 대상. 이 잡이 없던 동안 Java 통합 테스트 17개가
  # 깨진 채로 dev가 초록이었습니다 — 이관이 끝날 때까지 여기가 유일한 관문입니다.
  api-java:
    name: api-java (gradle test · Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-java
    env:
      # FlywayBaselineTest가 alembic을 못 돌리면 건너뛰지 말고 실패하게 합니다.
      # 건너뛰기를 허용하면 "둘 다 낡아도 초록"인 자기참조 상태로 되돌아갑니다.
      REQUIRE_ALEMBIC_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # FlywayBaselineTest가 apps/api의 alembic을 실제로 돌려 스키마를 대조합니다.
      # 그래서 Java 잡인데도 파이썬 워크스페이스가 필요합니다.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync python deps (alembic 대조용)
        working-directory: apps/api
        run: uv sync --frozen --all-packages

      # SPEC이 가리키는 심볼이 소스에 실재하는지 봅니다(/SPEC.md §12).
      # 라인 번호 참조가 dev 전진마다 조용히 낡던 문제를 막습니다.
      - name: SPEC 참조 드리프트 검사
        working-directory: ${{ github.workspace }}
        run: python3 spec/check-refs.py

      # Testcontainers가 postgres:18-alpine을 띄웁니다(운영 RDS와 같은 메이저).
      # 러너에 Docker가 기본 탑재돼 있고, DOCKER_API_VERSION은 build.gradle.kts가 채웁니다.
      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-java-test-report
          path: apps/api-java/build/reports/tests/test
