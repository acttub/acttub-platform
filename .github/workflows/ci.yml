name: Synthetic post-deploy analysis check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: insung-server
      - name: Analyze generated media only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new deploy@insung-server "bash -s" <<'REMOTE'
          set -euo pipefail
          cd /svc/acttub/dev
          compose() { docker compose --env-file .env --env-file release.env "$@"; }
          compose exec -T api sh -c 'base64 -d > /tmp/acttub-probe.jar' <<'PROBE'
          
          PROBE
          compose exec -T api sh -c 'base64 -d > /tmp/acttub-probe-speech.wav' <<'SYNTHETIC_AUDIO'
          UklGRkYAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAATElTVBoAAABJTkZPSVNGVA4AAABMYXZmNjIuMTIuMTAyAGRhdGEAAAAA
          SYNTHETIC_AUDIO
          compose exec -T api ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=blue:s=320x240:r=12 -i /tmp/acttub-probe-speech.wav -af apad -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/acttub-probe.mp4 </dev/null
          compose exec -T api java -Dloader.path=/tmp/acttub-probe.jar -Dloader.main=com.acttub.actingapi.integration.observation.GeminiProbe -cp /app/acting-api.jar org.springframework.boot.loader.launch.PropertiesLauncher /tmp/acttub-probe.mp4 </dev/null
          REMOTE
