name: Encrypted dev record read
on:
  workflow_dispatch:
    inputs:
      session:
        description: Session UUID; empty runs synthetic connectivity check
        required: false
        type: string
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: insung-server
      - name: Encrypt database result on server before transfer
        env:
          SESSION: ${{ inputs.session }}
        run: |
          set -euo pipefail
          umask 077
          [[ -z "$SESSION" || "$SESSION" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new deploy@insung-server "bash -s -- '$SESSION'" > record.cms <<'REMOTE'
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEHTCCAoWgAwIBAgIUCUIwIWzhhGG/SgV84ofmTZ/kq0cwDQYJKoZIhvcNAQEL
