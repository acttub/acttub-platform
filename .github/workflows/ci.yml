# PR 게이트 CI — dev·main으로 향하는 PR에서 웹·API·모바일을 검증합니다.
# 이 잡들을 ruleset 의 required status check 로 넣어야 초록불이어야만 머지가 됩니다.
# ⚠ ruleset 은 하나가 아닙니다 — "Require merge commits for main (release)"(main)과
# "Require pull requests for dev"(dev)가 같은 목록을 따로 들고 있어 둘 다 고쳐야 합니다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      live_coach_eval:
        description: 합성 장면으로 dev 모델을 평가합니다 (유료 실호출)
        type: boolean
        default: false
      eval_suite:
        description: 실제 모델 평가 대상
        type: choice
        options: [coach, note, continuity]
        default: coach

# 같은 PR에 새 커밋이 올라오면 진행 중이던 오래된 실행은 취소.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm을 먼저 깔아야 setup-node의 cache:pnpm이 동작합니다.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # pnpm-workspace.yaml가 apps/mobile(Expo)을 제외하므로 웹만 설치됩니다.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 빌드 모드는 하나뿐이고(standalone), 이것이 실제 배포 산출물입니다
      # (deploy.yml → apps/web/Dockerfile이 같은 명령을 씁니다).
      # Build를 typecheck보다 먼저 돌려야 합니다: next build가 next-env.d.ts와
      # .next/types(typedRoutes)를 생성해야 tsc가 *.png import·라우트 타입을 해석합니다.
      # 이 산출물들은 gitignore라 클린 체크아웃엔 없습니다.
      # API_ORIGIN은 빌드 시점에 굳지만, 여기서는 컴파일 여부만 보므로 기본값을 씁니다.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter web test

  # 백엔드의 유일한 관문입니다. 계약 하네스 잡 둘(`contract-harness`·
  # `contract-harness-java`)이 SOMA-403 4단계에서 사라졌고, 그것들이 보던 계약은
  # Java 테스트로 옮겨져 이 잡 안에서 돕니다(docs/archive/soma287/M6-contract-migration.md).
  #
  # ⚠ 잡 이름을 `api-java (…)` 에서 바꿨습니다(SOMA-403 5단계, 파이썬 잡이 사라지면서).
  # **잡 이름이 곧 required status check 의 context 라 ruleset 도 함께 갱신해야 합니다** —
  # 옛 이름을 required 로 남겨 두면 영원히 오지 않는 관문이 됩니다.
  api:
    name: api (gradle test · Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      # pull_request 의 체크아웃은 base 위의 merge commit 이라 HEAD^1 이 base 입니다 — 2커밋이면 변경 파일을 셉니다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # 배포·모니터링 검증은 잡 시간의 70%(약 13분)라 관련 파일이 바뀐 PR 에서만 돕니다(SOMA-552).
      # 잡 자체는 항상 돌아야 합니다 — required check 가 오지 않으면 PR 이 영원히 대기합니다.
      # main 으로 가는 릴리스 PR 과 수동 실행은 전부 돌려 운영 전 안전망을 유지합니다.
      # 앱 코드가 이미지 빌드를 깰 수 있어 Smoke 는 여기서 거르지 않고 항상 돕니다.
      - name: 변경 범위 판정
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] || [ "$BASE_REF" = main ]; then
            echo "전체 실행 ($EVENT → ${BASE_REF:-없음})"
            { echo monitoring=true; echo restore=true; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$files"
          monitoring=false; restore=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/ci.yml) monitoring=true; restore=true ;;
              deploy/monitoring/*|deploy/home/compose.yml|deploy/home/deploy.sh) monitoring=true ;;
            esac
            case "$f" in
              deploy/home/*|apps/api/src/main/resources/db/migration/*|apps/api/src/test/resources/schema-fingerprint.sql) restore=true ;;
            esac
          done <<< "$files"
          echo "monitoring=$monitoring restore=$restore"
          { echo "monitoring=$monitoring"; echo "restore=$restore"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers가 postgres:18-alpine을 띄웁니다(홈서버 PostgreSQL과 같은 메이저).
      # 러너에 Docker가 기본 탑재돼 있고, DOCKER_API_VERSION은 build.gradle.kts가 채웁니다.
      - name: Test
        run: ./gradlew test --no-daemon

      - name: Deploy guard tests
        working-directory: ${{ github.workspace }}
        run: |
          deploy/guard-test.sh
          deploy/home/deploy-test.sh

      - name: Monitoring collectors and configuration
        if: steps.changes.outputs.monitoring == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s deploy/monitoring/tests -v

      - name: Grafana configuration and alert rules
        if: steps.changes.outputs.monitoring == 'true'
        working-directory: ${{ github.workspace }}
        run: deploy/monitoring/cloud/check.sh

      # 배포 산출물 검증(SOMA-489)입니다. api·web 컨테이너 이미지를 굽고(push 없음) deploy/home/compose.yml 을
      # 실제 배포 스크립트(deploy/home/deploy.sh)로 임시 프로젝트에 띄워 web 경유 /·/health 와 commit 대조,
      # 같은 sha 재실행의 멱등성(두 번 돌려도 결과가 같음), 배포 스크립트의 빨강 둘(대기 시간 초과·commit 불일치)까지
      # 판정합니다.
      # 스크립트가 jar(bootJar)를 먼저 만드는데 위 Test 가 컴파일을 끝내 두어 빠릅니다. 웹 이미지는 Docker
      # 안에서 빌드되므로 이 잡에 node 가 없어도 됩니다. cloudflared·backup 프로필은 스모크에서 빠집니다.
      # 잡 이름은 그대로 둡니다 — required check context 라 바꾸면 ruleset 둘도 같이 가야 합니다.
      - name: Smoke (docker build ×2 · deploy.sh · compose)
        working-directory: ${{ github.workspace }}
        env:
          SMOKE_EXPORT_API_IMAGE: acttub-api:monitoring-ci
          SMOKE_EXPORT_WEB_IMAGE: acttub-web:monitoring-ci
        run: deploy/home/smoke.sh

      - name: Monitoring (scrape · isolation · persistence · independent deploy)
        if: steps.changes.outputs.monitoring == 'true'
        working-directory: ${{ github.workspace }}
        env:
          MONITORING_SMOKE_API_IMAGE: acttub-api:monitoring-ci
          MONITORING_SMOKE_WEB_IMAGE: acttub-web:monitoring-ci
        run: deploy/monitoring/smoke.sh

      - name: Restore (data · sequences · schema)
        if: steps.changes.outputs.restore == 'true'
        working-directory: ${{ github.workspace }}
        run: deploy/home/restore-test.sh

      - name: Backup (PostgreSQL dump · restore · scheduler · failures)
        if: steps.changes.outputs.restore == 'true'
        working-directory: ${{ github.workspace }}
        run: deploy/home/backup-smoke.sh

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: apps/api/build/reports/tests/test

  # 모바일은 pnpm 워크스페이스 밖이라(pnpm-workspace.yaml 의 !apps/mobile) 위 web
  # 잡이 설치조차 하지 않습니다. 이 잡이 생기기 전에는 apps/mobile 만 고친 PR 이
  # 아무것도 돌지 않은 채 초록이었습니다.
  #
  # 설치 단계가 없는 것은 실수가 아닙니다 — 스위트가 import 하는 것은 node: 빌트인과
  # 프로젝트 .ts 파일뿐이고 @/ 로 들어오는 둘은 import type 이라 타입 스트리핑에
  # 지워집니다. node_modules 를 통째로 치운 채 전부 통과하는 것을 확인했습니다.
  # 여기에 런타임 의존이 하나라도 생기면 npm ci 가 필요해집니다.
  #
  # ⚠ expo lint·tsc 는 일부러 뺐습니다. expo lint 는 Expo 전체 트리 설치가 필요해
  # 20초짜리 잡을 몇 분으로 늘리고, tsc 는 typedRoutes 타입(.expo/types, gitignore)이
  # 클린 체크아웃에 없어 실재하는 라우트를 전부 오류로 냅니다.
  mobile:
    name: mobile (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # .ts 를 그대로 import 합니다(Node 타입 스트리핑). 웹과 달리 커스텀 로더가 없습니다.
      - name: Test
        run: node --test tests/*.test.mjs

  coach_eval:
    name: 합성 대화·노트 · 실제 dev 모델
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_coach_eval }}
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: insung-server
      - name: Evaluate synthetic conversations
        run: python3 .github/scripts/run-coach-eval.py "${{ inputs.eval_suite || 'coach' }}"
      - name: Save synthetic evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-synthetic-eval
          retention-days: 7
          path: |
            apps/api/build/response-selection-eval
            apps/api/build/scene-context-eval
            apps/api/build/structured-coach-eval
            apps/api/build/note-continuity-eval
            apps/api/build/dialogue-continuity-eval
            apps/api/build/reports/tests/test
