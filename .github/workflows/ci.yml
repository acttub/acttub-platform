          rQ==
          -----END CERTIFICATE-----
          CERT
          cd /svc/acttub/dev
          compose() { docker compose --env-file .env --env-file release.env "$@"; }
          if [[ -z "$1" ]]; then
            query="SELECT jsonb_build_object('probe','acttub-encrypted-read-ok','source','dev-postgresql');"
          else
            query="SELECT jsonb_build_object(
              'practice_sessions',(SELECT coalesce(jsonb_agg(to_jsonb(t)), '[]'::jsonb) FROM practice_sessions t WHERE id='$1'),
              'summaries',(SELECT coalesce(jsonb_agg(to_jsonb(t)), '[]'::jsonb) FROM summaries t WHERE session_id='$1'),
              'coach_sessions',(SELECT coalesce(jsonb_agg(to_jsonb(t)), '[]'::jsonb) FROM coach_sessions t WHERE to_jsonb(t)->>'practice_session_id'='$1' OR summary_id IN (SELECT id FROM summaries WHERE session_id='$1')),
              'coach_turns',(SELECT coalesce(jsonb_agg(to_jsonb(t) ORDER BY t.turn_index), '[]'::jsonb) FROM coach_turns t WHERE session_id IN (SELECT c.id FROM coach_sessions c WHERE to_jsonb(c)->>'practice_session_id'='$1' OR c.summary_id IN (SELECT id FROM summaries WHERE session_id='$1'))),
              'practice_reports',(SELECT coalesce(jsonb_agg(to_jsonb(t)), '[]'::jsonb) FROM practice_reports t WHERE practice_session_id='$1'),
              'operations',(SELECT coalesce(jsonb_agg(jsonb_build_object('kind',kind,'status',status,'error_code',error_code)), '[]'::jsonb) FROM external_operations WHERE session_id='$1')
            );"
          fi
          if ! compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=15000' db psql -X -v ON_ERROR_STOP=1 -U acttub -d acttub -Atc "$query" </dev/null 2>"$tmp/error" | openssl cms -encrypt -binary -aes-256-cbc -outform DER -out "$tmp/record.cms" "$tmp/recipient.pem" 2>>"$tmp/error"; then
            echo 'Encrypted read failed; diagnostic details withheld.' >&2
            exit 1
          fi
          cat "$tmp/record.cms"
          REMOTE
          test -s record.cms
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-dev-record
          path: record.cms
          retention-days: 1
          if-no-files-found: error
