# PR 게이트 CI — dev·main으로 향하는 PR에서 웹·API를 검증합니다.
# ruleset "Require pull requests for main and dev"에 이 잡들을 required status check로
# 추가하면, 초록불이어야만 머지가 됩니다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch: # Actions 탭에서 수동 실행

# 같은 PR에 새 커밋이 올라오면 진행 중이던 오래된 실행은 취소.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm을 먼저 깔아야 setup-node의 cache:pnpm이 동작합니다.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # pnpm-workspace.yaml가 apps/mobile(Expo)을 제외하므로 웹만 설치됩니다.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 빌드 모드는 하나뿐이고(standalone), 이것이 실제 배포 산출물입니다
      # (deploy.yml → upload-web.sh가 같은 명령을 씁니다).
      # Build를 typecheck보다 먼저 돌려야 합니다: next build가 next-env.d.ts와
      # .next/types(typedRoutes)를 생성해야 tsc가 *.png import·라우트 타입을 해석합니다.
      # 이 산출물들은 gitignore라 클린 체크아웃엔 없습니다.
      # API_ORIGIN은 빌드 시점에 굳지만, 여기서는 컴파일 여부만 보므로 기본값을 씁니다.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter web test

  # 백엔드의 유일한 관문입니다. 계약 하네스 잡 둘(`contract-harness`·
  # `contract-harness-java`)이 SOMA-403 4단계에서 사라졌고, 그것들이 보던 계약은
  # Java 테스트로 옮겨져 이 잡 안에서 돕니다(docs/archive/soma287/M6-contract-migration.md).
  #
  # ⚠ 잡 이름을 `api-java (…)` 에서 바꿨습니다(SOMA-403 5단계, 파이썬 잡이 사라지면서).
  # **잡 이름이 곧 required status check 의 context 라 ruleset 도 함께 갱신해야 합니다** —
  # 옛 이름을 required 로 남겨 두면 영원히 오지 않는 관문이 됩니다.
  api:
    name: api (gradle test · Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers가 postgres:18-alpine을 띄웁니다(운영 RDS와 같은 메이저).
      # 러너에 Docker가 기본 탑재돼 있고, DOCKER_API_VERSION은 build.gradle.kts가 채웁니다.
      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: apps/api/build/reports/tests/test
