name: Read dev analysis failure
on:
  workflow_dispatch:
    inputs:
      session:
        description: Practice session UUID
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: insung-server
      - name: Read failure metadata only
        env:
          SESSION: ${{ inputs.session }}
        run: |
          set -euo pipefail
          [[ "$SESSION" =~ ^[0-9a-f-]{36}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new deploy@insung-server "bash -s -- '$SESSION'" <<'REMOTE'
          set -euo pipefail
          cd /svc/acttub/dev
          compose() { docker compose --env-file .env --env-file release.env "$@"; }
          compose exec -T db psql -U acttub -d acttub -Atc "SELECT kind,status,attempt_count,error_code,last_failure_classification,created_at,updated_at FROM external_operations WHERE session_id='$1' ORDER BY created_at;"
          ids=$(compose exec -T db psql -U acttub -d acttub -Atc "SELECT id FROM external_operations WHERE session_id='$1' AND kind='analyze';")
          compose logs --no-color --since 48h api 2>&1 | python3 -c '
          import sys,re
          ids=sys.argv[1].split()
          lines=sys.stdin.readlines()
          for i,line in enumerate(lines):
              if "analysis failed:" in line and any(x in line for x in ids):
                  print("MATCHED_ANALYSIS_FAILURE")
                  for row in lines[i+1:i+16]:
                      match=re.search(r"(?:[a-zA-Z_$][\w$]*\.)+([A-Za-z_$][\w$]*(?:Exception|Error))(?::|$)",row)
                      if match: print("EXCEPTION_CLASS="+match.group(1))
                      for known in ["no usable video record chunks", "timed out", "timeout", "429", "403", "401", "404", "400", "503", "ffmpeg", "ffprobe", "Cannot run program", "No such file"]:
                          if known in row: print("ERROR_MARKER="+known)
          ' "$ids"
          REMOTE
